<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Global SkyPixel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { background-color: #000; overflow: hidden; width: 100vw; height: 100vh; }

        /* Viewport para o sistema de arraste */
        #viewport { width: 100%; height: 100%; position: absolute; overflow: hidden; }

        /* Container do Mapa - Igual à lógica do map-layer do radar */
        #map-container {
            width: 2500px; height: 2500px;
            position: absolute; 
            transform-origin: 0 0;
            will-change: transform;
            display: none; /* Começa escondido igual o radar */
        }

        #map-img {
            width: 100%; height: 100%;
            background-image: url('map.png');
            background-size: 100% 100%;
        }

        #gps-svg {
            position: absolute; top: 0; left: 0;
            width: 2500px; height: 2500px;
            z-index: 10; pointer-events: none;
            overflow: visible;
        }

        #player-marker {
            position: absolute; width: 30px; height: 30px;
            background-image: url('seta.png');
            background-size: contain; background-repeat: no-repeat;
            z-index: 20; transform: translate(-50%, -50%);
        }

        .btn-fechar {
            position: absolute; top: 20px; right: 20px;
            padding: 15px 25px; background: rgba(255, 0, 0, 0.8);
            color: white; font-weight: bold; border-radius: 8px; z-index: 100;
        }

        #recenter-btn {
            position: absolute; bottom: 30px; right: 30px;
            padding: 12px 20px; background: #bf00ff; color: white;
            font-weight: bold; border-radius: 50px; z-index: 100;
            display: none; border: 2px solid white;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="map-container">
            <div id="map-img"></div>
            <svg id="gps-svg" viewBox="0 0 2500 2500">
                <polyline id="gps-path" points="" fill="none" stroke="#bf00ff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div id="player-marker"></div>
        </div>
    </div>

    <div class="btn-fechar" onclick="fecharMapa()">X</div>
    <div id="recenter-btn" onclick="ativarSeguir()">VOLTAR AO GPS</div>

    <script>
        // --- CONSTANTES DO RADAR QUE FUNCIONA ---
        const IMG_SIZE = 2500;
        const MAP_SIZE = 6000;
        const SCALE = IMG_SIZE / MAP_SIZE;
        const OFFSET = 1250;
        const SMOOTH_SPEED = 0.2; // Suavização do Radar

        let mapX = 0, mapY = 0;
        let targetX = 0, targetY = 0;
        let zoom = 0.8;
        let isDragging = false, startX, startY;
        let autoFollow = true; 
        let primeiraCarga = true;

        const container = document.getElementById('map-container');
        const marker = document.getElementById('player-marker');
        const gpsPath = document.getElementById('gps-path');
        const recenterBtn = document.getElementById('recenter-btn');

        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }

        function fecharMapa() {
            if(window.geckoju) window.geckoju.send("fecharMapaGlobal");
        }

        function ativarSeguir() {
            autoFollow = true;
            recenterBtn.style.display = 'none';
        }

        function Conectar() {
            if(!window.geckoju) { setTimeout(Conectar, 200); return; }

            window.geckoju.onData = function(data) {
                try {
                    const obj = JSON.parse(data);

                    // 1. POSIÇÃO (Lógica idêntica ao radar.html)
                    let rx = (obj.x !== undefined) ? obj.x : obj.pX;
                    let ry = (obj.y !== undefined) ? obj.y : obj.pY;
                    let pa = (obj.a !== undefined) ? obj.a : obj.pAngle;

                    if (rx !== undefined && ry !== undefined) {
                        // Mostra o mapa só quando recebe o primeiro dado
                        if(primeiraCarga) {
                            container.style.display = 'block';
                            primeiraCarga = false;
                        }

                        let pixelX = OFFSET + (rx * SCALE);
                        let pixelY = OFFSET - (ry * SCALE);
                        
                        // Move a seta
                        marker.style.left = pixelX + 'px';
                        marker.style.top = pixelY + 'px';
                        if(pa !== undefined) marker.style.transform = `translate(-50%, -50%) rotate(${pa}deg)`;

                        // LÓGICA DE SEGUIR O JOGADOR
                        if(obj.first_open || autoFollow) {
                            targetX = (window.innerWidth / 2) - (pixelX * zoom);
                            targetY = (window.innerHeight / 2) - (pixelY * zoom);
                            
                            // Se for a abertura, vai instantâneo, se não, vai suave
                            if(obj.first_open) {
                                mapX = targetX;
                                mapY = targetY;
                            }
                        }
                    }

                    // 2. ROTA GPS
                    if(obj.string_rota) {
                        let pontos = obj.string_rota.split('|');
                        let svgStr = "";
                        pontos.forEach(p => {
                            let c = p.split(',');
                            if(c.length >= 2) {
                                let rx_gps = OFFSET + (parseFloat(c[0]) * SCALE);
                                let ry_gps = OFFSET - (parseFloat(c[1]) * SCALE);
                                svgStr += `${rx_gps.toFixed(1)},${ry_gps.toFixed(1)} `;
                            }
                        });
                        gpsPath.setAttribute('points', svgStr);
                    } else if(obj.gps_off) {
                        gpsPath.setAttribute('points', "");
                    }

                } catch(e) {}
            };
        }

        // Loop de animação suave (copiado do animate() do radar)
        function animate() {
            if (autoFollow) {
                mapX = lerp(mapX, targetX, SMOOTH_SPEED);
                mapY = lerp(mapY, targetY, SMOOTH_SPEED);
            }
            container.style.transform = `translate(${mapX}px, ${mapY}px) scale(${zoom})`;
            requestAnimationFrame(animate);
        }

        // CONTROLES DE ARRASTE
        const viewport = document.getElementById('viewport');
        viewport.addEventListener('touchstart', e => {
            isDragging = true;
            autoFollow = false; 
            recenterBtn.style.display = 'block';
            startX = e.touches[0].pageX - mapX;
            startY = e.touches[0].pageY - mapY;
        });

        viewport.addEventListener('touchmove', e => {
            if(!isDragging) return;
            mapX = e.touches[0].pageX - startX;
            mapY = e.touches[0].pageY - startY;
        });

        viewport.addEventListener('touchend', () => isDragging = false);

        Conectar();
        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Global SkyPixel - GTA V Style</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { background-color: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: 'Segoe UI', 'Roboto', sans-serif; }

        #viewport { width: 100%; height: 100%; position: absolute; overflow: hidden; }

        #map-container {
            width: 2500px; height: 2500px;
            position: absolute; transform-origin: 0 0;
            will-change: transform; display: none;
        }

        #map-img {
            width: 100%; height: 100%;
            background-image: url('map.png'); /* SEU MAPA AQUI */
            background-size: 100% 100%;
        }

        #gps-svg {
            position: absolute; top: 0; left: 0;
            width: 2500px; height: 2500px;
            z-index: 10; pointer-events: none; overflow: visible;
        }

        #player-marker {
            position: absolute; width: 30px; height: 30px;
            background-image: url('seta.png'); /* SUA SETA AQUI */
            background-size: contain; background-repeat: no-repeat;
            z-index: 20; transform: translate(-50%, -50%);
        }

        /* --- UI GTA V STYLE --- */

        /* Botão Fechar (X) - MOVIDO PARA A ESQUERDA */
        .btn-fechar {
            position: absolute; top: 20px; left: 20px; /* Alterado de right para left */
            width: 45px; height: 45px;
            background: rgba(15, 15, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; z-index: 110; cursor: pointer;
            backdrop-filter: blur(5px); transition: all 0.2s ease;
        }
        .btn-fechar:active { transform: scale(0.9); background: rgba(15, 15, 20, 0.9); }

        /* Container da Legenda (Continua na Direita) */
        #legend-container {
            position: absolute; top: 20px; right: 20px; /* Subi um pouco já que o X não está mais aqui */
            z-index: 100;
            display: flex; flex-direction: column;
            align-items: flex-end; 
            max-height: 85vh; overflow-y: auto;
        }
        #legend-container::-webkit-scrollbar { display: none; }

        /* Estilo base dos "Quadradinhos" - COM GRADIENTE AZUL/ROXO */
        .legend-block {
            display: flex; align-items: center;
            width: fit-content; 
            white-space: nowrap; 
            padding: 10px 15px;
            margin-bottom: 8px; 
            
            /* O GRADIENTE MÁGICO */
            background: linear-gradient(135deg, rgba(20, 25, 60, 0.85) 0%, rgba(70, 20, 90, 0.85) 100%);
            backdrop-filter: blur(8px);
            border-radius: 6px;
            border-left: 3px solid rgba(130, 80, 255, 0.5); /* Borda roxa clarinha */
            
            color: rgba(255,255,255,0.9);
            font-size: 13px; font-weight: 500;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        
        /* Efeito ao passar o mouse ou clicar */
        .legend-block:hover, .legend-block:active { 
            background: linear-gradient(135deg, rgba(30, 40, 90, 0.95) 0%, rgba(100, 30, 130, 0.95) 100%); 
            color: #fff; 
            border-left: 3px solid #bf00ff; /* Acende a borda */
            transform: translateX(-5px); /* Dá um pulinho pra esquerda */
        }

        /* Ícones (Emojis) */
        .blip-icon { font-size: 18px; margin-right: 12px; filter: drop-shadow(0 0 4px rgba(255,255,255,0.4)); }

        /* Botão Centralizar - Combinando com o novo tema */
        #recenter-btn {
            position: absolute; bottom: 30px; right: 30px;
            padding: 12px 25px; 
            background: linear-gradient(135deg, rgba(20, 25, 60, 0.9) 0%, rgba(70, 20, 90, 0.9) 100%);
            color: #fff; font-weight: 700; font-size: 13px; letter-spacing: 1px;
            border-radius: 4px; z-index: 100;
            display: none; border-left: 3px solid #bf00ff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px); cursor: pointer; text-transform: uppercase;
        }
        #recenter-btn:active { transform: scale(0.95); }
        /* Adicione dentro da tag <style> */
        .blip {
            position: absolute;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            z-index: 15;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 3px #000;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="map-container">
            <div id="map-img">
                <div class="blip" style="left: 1774px; top: 721px;">📱</div> 
                <div class="blip" style="left: 1865px; top: 918px;">⚖️</div>
            </div>
            <svg id="gps-svg" viewBox="0 0 2500 2500">
                <polyline id="gps-path" points="" fill="none" stroke="#bf00ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 5px #bf00ff); vector-effect: non-scaling-stroke;"/>
            </svg>
            <div id="player-marker"></div>
        </div>
    </div>

    <div class="btn-fechar" onclick="fecharMapa()">&#10005;</div>
    
    <div id="recenter-btn" onclick="ativarSeguir()">Localização Atual</div>

    <div id="legend-container">
        <div class="legend-block" onclick="marcarPelaLegenda(event, 1476.84, -1740.43)">
            <span class="blip-icon">⚖️</span> Prefeitura
        </div>
        
        <div class="legend-block" onclick="marcarPelaLegenda(event, 1259.48, -1266.82)">
            <span class="blip-icon">📱</span> Loja Samsung
        </div>

        <div class="legend-block" onclick="marcarPelaLegenda(event, 1530.00, -1670.00)">
            <span class="blip-icon">🚓</span> Dep. Polícia (LSPD)
        </div>
        
        <div class="legend-block" onclick="marcarPelaLegenda(event, 1172.00, -1323.00)">
            <span class="blip-icon">🏥</span> Hospital
        </div>
        
        <div class="legend-block" onclick="marcarPelaLegenda(event, 555.00, -1274.00)">
            <span class="blip-icon">🚗</span> Concessionária
        </div>
    </div>

    <script>
        // --- LÓGICA DO MAPA (Intacta) ---
        const SCALE = 2500 / 6000;
        const OFFSET = 1250;
        const SMOOTH_SPEED = 0.2;

        let mapX = 0, mapY = 0, targetX = 0, targetY = 0, zoom = 0.8;
        let isDragging = false, startX, startY, autoFollow = true, loaded = false;
        let touchStartTime = 0, hasMoved = false, pinchDistStart = 0, pinchZoomStart = 0;

        const container = document.getElementById('map-container');
        const marker = document.getElementById('player-marker');
        const gpsPath = document.getElementById('gps-path');
        const recenterBtn = document.getElementById('recenter-btn');

        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }
        function fecharMapa() { if(window.geckoju) window.geckoju.send("fecharMapaGlobal"); }
        function ativarSeguir() { autoFollow = true; recenterBtn.style.display = 'none'; }

        function MarcarDestino(screenX, screenY) {
            let rect = container.getBoundingClientRect();
            
            // 1. Calcula exatamente onde o dedo/mouse clicou no mapa
            let clickX = (screenX - rect.left) / zoom;
            let clickY = (screenY - rect.top) / zoom;
            
            // 2. Converte para as coordenadas reais do jogo
            let gtaX = (clickX - OFFSET) / SCALE;
            let gtaY = (OFFSET - clickY) / SCALE; 
            
            // 3. Manda pro seu servidor SAMP (PAWN) fazer a rota
            if(window.geckoju) {
                window.geckoju.send(`gps_destino|${gtaX.toFixed(1)}|${gtaY.toFixed(1)}`);
            }
            
            // --- NOVIDADES: PIN VISUAL E CONTROLE DE CÂMERA ---
            
            // 4. Move o pino/waypoint vermelho para o local clicado
            let waypoint = document.getElementById('waypoint');
            if(waypoint) {
                waypoint.style.display = 'block';
                waypoint.style.left = clickX + 'px';
                waypoint.style.top = clickY + 'px';
            }
            
            // 5. Destrava a câmera para não puxar de volta pro personagem na mesma hora
            autoFollow = false;
            
            // 6. Mostra o botão de recentralizar (caso você tenha no código)
            if(typeof recenterBtn !== 'undefined' && recenterBtn) {
                recenterBtn.style.display = 'block';
            }
        }

        function Conectar() {
            if(!window.geckoju) { setTimeout(Conectar, 100); return; }
            window.geckoju.onData = function(data) {
                try {
                    const obj = JSON.parse(data);
                    
                    let rx = (obj.x !== undefined) ? obj.x : obj.pX;
                    let ry = (obj.y !== undefined) ? obj.y : obj.pY;
                    
                    if (rx !== undefined) {
                        if(!loaded) { container.style.display = 'block'; loaded = true; }
                        let px = OFFSET + (rx * SCALE);
                        let py = OFFSET - (ry * SCALE);
                        marker.style.left = px + 'px';
                        marker.style.top = py + 'px';
                        if(obj.a !== undefined) marker.style.transform = `translate(-50%, -50%) rotate(${obj.a}deg)`;

                        if(autoFollow || obj.first_open) {
                            targetX = (window.innerWidth / 2) - (px * zoom);
                            targetY = (window.innerHeight / 2) - (py * zoom);
                            if(obj.first_open) { mapX = targetX; mapY = targetY; }
                        }
                    }

                    // GPS Fatiado
                    if(obj.gps_start) gpsPath.setAttribute('points', "");

                    if(obj.rn && Array.isArray(obj.rn)) {
                        let currentSvg = gpsPath.getAttribute('points') || "";
                        for(let i = 0; i < obj.rn.length; i += 2) {
                            if(obj.rn[i] === undefined || obj.rn[i+1] === undefined) break; 
                            let rpx = OFFSET + (obj.rn[i] * SCALE);
                            let rpy = OFFSET - (obj.rn[i+1] * SCALE);
                            currentSvg += `${rpx.toFixed(1)},${rpy.toFixed(1)} `;
                        }
                        gpsPath.setAttribute('points', currentSvg);
                    }
                    
                    if(obj.gps_off) gpsPath.setAttribute('points', "");
                } catch(e) {}
            };
        }

        function animate() {
            if (autoFollow) {
                mapX = lerp(mapX, targetX, SMOOTH_SPEED);
                mapY = lerp(mapY, targetY, SMOOTH_SPEED);
            }
            container.style.transform = `translate(${mapX}px, ${mapY}px) scale(${zoom})`;
            requestAnimationFrame(animate);
        }

        const viewport = document.getElementById('viewport');
        
        viewport.addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
                isDragging = false; autoFollow = false; 
                pinchDistStart = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                pinchZoomStart = zoom;
            } else if (e.touches.length === 1) {
                isDragging = true; hasMoved = false; touchStartTime = Date.now();
                startX = e.touches[0].pageX - mapX; startY = e.touches[0].pageY - mapY;
            }
        });

        viewport.addEventListener('touchmove', e => {
            if (e.touches.length === 2) {
                let dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                zoom = Math.min(Math.max(0.3, pinchZoomStart * (dist / pinchDistStart)), 4.0);
                recenterBtn.style.display = 'block';
                container.style.transform = `translate(${mapX}px, ${mapY}px) scale(${zoom})`;
            } else if(isDragging && e.touches.length === 1) {
                hasMoved = true; autoFollow = false; recenterBtn.style.display = 'block';
                mapX = e.touches[0].pageX - startX; mapY = e.touches[0].pageY - startY;
            }
        });

        viewport.addEventListener('touchend', (e) => { 
            isDragging = false; 
            if (e.touches.length === 0 && !hasMoved && (Date.now() - touchStartTime < 200)) {
                let touch = e.changedTouches[0];
                MarcarDestino(touch.pageX, touch.pageY);
            }
        });

        Conectar();
        animate();
    </script>
</body>
</html>

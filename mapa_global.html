<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Global SkyPixel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { background-color: #000; overflow: hidden; width: 100vw; height: 100vh; }

        #viewport { width: 100%; height: 100%; position: absolute; overflow: hidden; }

        #map-container {
            width: 2500px; height: 2500px;
            position: absolute; transform-origin: 0 0;
            will-change: transform;
            display: none;
        }

        #map-img {
            width: 100%; height: 100%;
            background-image: url('map.png');
            background-size: 100% 100%;
        }

        #gps-svg {
            position: absolute; top: 0; left: 0;
            width: 2500px; height: 2500px;
            z-index: 10; pointer-events: none;
            overflow: visible;
        }

        #player-marker {
            position: absolute; width: 30px; height: 30px;
            background-image: url('seta.png');
            background-size: contain; background-repeat: no-repeat;
            z-index: 20; transform: translate(-50%, -50%);
        }

        .btn-fechar {
            position: absolute; top: 20px; right: 20px;
            padding: 15px 25px; background: rgba(255, 0, 0, 0.8);
            color: white; font-weight: bold; border-radius: 8px; z-index: 100;
        }

        #recenter-btn {
            position: absolute; bottom: 30px; right: 30px;
            padding: 12px 20px; background: #bf00ff; color: white;
            font-weight: bold; border-radius: 50px; z-index: 100;
            display: none; border: 2px solid white;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="map-container">
            <div id="map-img"></div>
            <svg id="gps-svg" viewBox="0 0 2500 2500">
                <polyline id="gps-path" points="" fill="none" stroke="#bf00ff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div id="player-marker"></div>
        </div>
    </div>

    <div class="btn-fechar" onclick="fecharMapa()">X</div>
    <div id="recenter-btn" onclick="ativarSeguir()">CENTRALIZAR</div>

    <script>
        // --- VARIÁVEIS GLOBAIS ---
        // --- CONFIGURAÇÕES ---
        const SCALE = 2500 / 6000;
        const OFFSET = 1250;
        const SMOOTH_SPEED = 0.2;

        let mapX = 0, mapY = 0;
        let targetX = 0, targetY = 0;
        let zoom = 0.8;
        
        let isDragging = false, startX, startY;
        let autoFollow = true;
        let loaded = false;
        
        let touchStartTime = 0;
        let hasMoved = false;
        let pinchDistStart = 0;
        let pinchZoomStart = 0;

        const container = document.getElementById('map-container');
        const marker = document.getElementById('player-marker');
        const gpsPath = document.getElementById('gps-path');
        const recenterBtn = document.getElementById('recenter-btn');

        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }
        function fecharMapa() { if(window.geckoju) window.geckoju.send("fecharMapaGlobal"); }
        function ativarSeguir() { autoFollow = true; recenterBtn.style.display = 'none'; }

        function MarcarDestino(screenX, screenY) {
            let rect = container.getBoundingClientRect();
            let clickX = (screenX - rect.left) / zoom;
            let clickY = (screenY - rect.top) / zoom;
            let gtaX = (clickX - OFFSET) / SCALE;
            let gtaY = (OFFSET - clickY) / SCALE; 

            if(window.geckoju) {
                // Manda com apenas 1 casa decimal pra economizar banda de upload
                window.geckoju.send(`gps_destino|${gtaX.toFixed(1)}|${gtaY.toFixed(1)}`);
            }
        }

        function Conectar() {
            if(!window.geckoju) { setTimeout(Conectar, 100); return; }
            
            window.geckoju.onData = function(data) {
                try {
                    const obj = JSON.parse(data);
                    
                    // 1. POSIÇÃO DO PLAYER
                    let rx = (obj.x !== undefined) ? obj.x : obj.pX;
                    let ry = (obj.y !== undefined) ? obj.y : obj.pY;
                    
                    if (rx !== undefined) {
                        if(!loaded) { container.style.display = 'block'; loaded = true; }
                        let px = OFFSET + (rx * SCALE);
                        let py = OFFSET - (ry * SCALE);
                        marker.style.left = px + 'px';
                        marker.style.top = py + 'px';
                        if(obj.a !== undefined) marker.style.transform = `translate(-50%, -50%) rotate(${obj.a}deg)`;

                        if(autoFollow || obj.first_open) {
                            targetX = (window.innerWidth / 2) - (px * zoom);
                            targetY = (window.innerHeight / 2) - (py * zoom);
                            if(obj.first_open) { mapX = targetX; mapY = targetY; }
                        }
                    }

                    // 2. SISTEMA DE ROTA SUPER COMPACTO
                    
                    // Limpar (Start)
                    if(obj.gps_start) {
                        gpsPath.setAttribute('points', "");
                    }

                    // Receber Tripa de Números: [x, y, x, y, x, y...]
                    if(obj.rn && Array.isArray(obj.rn)) {
                        let currentSvg = gpsPath.getAttribute('points') || "";
                        
                        // Loop pulando de 2 em 2 (porque vem X e Y sequencial)
                        for(let i = 0; i < obj.rn.length; i += 2) {
                            let rawX = obj.rn[i];
                            let rawY = obj.rn[i+1];
                            
                            let rpx = OFFSET + (rawX * SCALE);
                            let rpy = OFFSET - (rawY * SCALE);
                            
                            // Adiciona ao SVG
                            currentSvg += `${rpx.toFixed(1)},${rpy.toFixed(1)} `;
                        }
                        
                        gpsPath.setAttribute('points', currentSvg);
                    }
                    
                    // Desligar
                    if(obj.gps_off) {
                        gpsPath.setAttribute('points', "");
                    }

                } catch(e) {}
            };
        }

        function animate() {
            if (autoFollow) {
                mapX = lerp(mapX, targetX, SMOOTH_SPEED);
                mapY = lerp(mapY, targetY, SMOOTH_SPEED);
            }
            container.style.transform = `translate(${mapX}px, ${mapY}px) scale(${zoom})`;
            requestAnimationFrame(animate);
        }

        const viewport = document.getElementById('viewport');
        viewport.addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
                isDragging = false; autoFollow = false; 
                pinchDistStart = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                pinchZoomStart = zoom;
            } else if (e.touches.length === 1) {
                isDragging = true; hasMoved = false; touchStartTime = Date.now();
                startX = e.touches[0].pageX - mapX; startY = e.touches[0].pageY - mapY;
            }
        });

        viewport.addEventListener('touchmove', e => {
            if (e.touches.length === 2) {
                let dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                zoom = Math.min(Math.max(0.3, pinchZoomStart * (dist / pinchDistStart)), 4.0);
                recenterBtn.style.display = 'block';
                container.style.transform = `translate(${mapX}px, ${mapY}px) scale(${zoom})`;
            } else if(isDragging && e.touches.length === 1) {
                hasMoved = true; autoFollow = false; recenterBtn.style.display = 'block';
                mapX = e.touches[0].pageX - startX; mapY = e.touches[0].pageY - startY;
            }
        });

        viewport.addEventListener('touchend', (e) => { 
            isDragging = false; 
            if (e.touches.length === 0 && !hasMoved && (Date.now() - touchStartTime < 200)) {
                let touch = e.changedTouches[0];
                MarcarDestino(touch.pageX, touch.pageY);
            }
        });

        Conectar();
        animate();
    </script>
</body>
</html>

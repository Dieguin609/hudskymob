<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* RESET GERAL */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; user-select: none; -webkit-user-select: none; touch-action: none; }
        
        body {
            background-color: #000;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
            width: 100vw; height: 100vh;
        }

        /* ÁREA DE VISUALIZAÇÃO */
        #viewport {
            width: 100%; height: 100%;
            position: absolute;
            overflow: hidden;
            background: #000;
        }

        /* CONTAINER QUE MEXE */
        #map-container {
            width: 2500px; /* IMG_SIZE */
            height: 2500px;
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
        }

        #map-img { width: 100%; height: 100%; display: block; filter: none !important; }

        /* SVG DA ROTA (ROXO) */
        #gps-svg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        #gps-path { 
            fill: none; 
            stroke: #bf00ff; 
            stroke-width: 12; 
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0px 0px 4px rgba(191, 0, 255, 0.6));
        }

        /* MARCADOR DE DESTINO */
        .waypoint {
            position: absolute; width: 24px; height: 24px;
            background: #bf00ff; border: 3px solid #fff; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
            z-index: 50; box-shadow: 0 0 10px #bf00ff; display: none;
        }

        /* MENU LATERAL (BOTÕES AZUIS) */
        .side-nav {
            position: absolute; top: 20px; right: 20px;
            display: flex; flex-direction: column; align-items: flex-end;
            gap: 8px; z-index: 1000; max-height: 90vh; overflow-y: auto;
            pointer-events: auto;
        }

        .nav-item {
            background: rgba(0, 122, 255, 0.9);
            color: #fff;
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 13px; font-weight: 700; text-transform: uppercase;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: fit-content; white-space: nowrap;
            cursor: pointer;
        }

        .nav-item:active { transform: scale(0.95); background: #0056b3; }
        .emoji-icon { font-size: 16px; }

        /* BOTÃO FECHAR (X) */
        .close-btn {
            position: absolute; top: 20px; left: 20px;
            width: 45px; height: 45px;
            background: rgba(0, 0, 0, 0.4);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; z-index: 2000;
        }
        .close-btn:active { background: #ff4444; color: white; }

        /* INSTRUÇÃO DE TOQUE LONGO */
        .instr-text {
            position: absolute; bottom: 20px; width: 100%;
            text-align: center; color: rgba(255,255,255,0.5);
            font-size: 12px; pointer-events: none; text-shadow: 1px 1px 2px #000;
        }
    </style>
</head>
<body>

    <div class="close-btn" onclick="fecharMapa()">✕</div>

    <div id="viewport">
        <div id="map-container">
            <img src="map.png" id="map-img">
            
            <svg id="gps-svg" width="2500" height="2500">
                <polyline id="gps-path" points="" />
            </svg>
            
            <div id="markers-layer">
                <div id="destino-marcador" class="waypoint"></div>
            </div>
        </div>
    </div>

    <div class="side-nav">
        <div class="nav-item" onclick="gpsParaLocal(1481, -1750)">
            <span class="emoji-icon">🏛️</span> <span>Prefeitura</span>
        </div>
        <div class="nav-item" onclick="gpsParaLocal(1242, -1694)">
            <span class="emoji-icon">🏥</span> <span>Hospital Central</span>
        </div>
        <div class="nav-item" onclick="gpsParaLocal(1543, -1675)">
            <span class="emoji-icon">🚔</span> <span>Delegacia</span>
        </div>
        <div class="nav-item" onclick="gpsParaLocal(-2024, 156)">
            <span class="emoji-icon">🔧</span> <span>Mecânica Benny's</span>
        </div>
        <div class="nav-item" onclick="gpsParaLocal(2100, -1800)">
            <span class="emoji-icon">🍕</span> <span>Pizzaria</span>
        </div>
    </div>

    <div class="instr-text">Segure o dedo para marcar um destino livre</div>

    <script>
        const IMG_SIZE = 2500;
        const MAP_SIZE = 6000;
        const SCALE = IMG_SIZE / MAP_SIZE;
        const OFFSET = IMG_SIZE / 2;

        let zoom = 1.0, mapX = 0, mapY = 0;
        let isDragging = false, startX, startY;
        let pinchDistStart = 0, pinchZoomStart = 1;

        const container = document.getElementById('map-container');
        const viewport = document.getElementById('viewport');
        const marcador = document.getElementById('destino-marcador');

        function gtaToPixels(x, y) {
            return { x: OFFSET + (x * SCALE), y: OFFSET - (y * SCALE) };
        }
        function pixelsToGta(px, py) {
            return { x: (px - OFFSET) / SCALE, y: (OFFSET - py) / SCALE };
        }

        // ==========================================
        // SISTEMA DE TOQUE E ARRASTE (MOBILE)
        // ==========================================
        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].pageX - mapX;
                startY = e.touches[0].pageY - mapY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                pinchDistStart = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                pinchZoomStart = zoom;
            }
        }, { passive: false });

        viewport.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Impede zoom da página
            if (isDragging && e.touches.length === 1) {
                mapX = e.touches[0].pageX - startX;
                mapY = e.touches[0].pageY - startY;
            } else if (e.touches.length === 2) {
                let dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                zoom = Math.min(Math.max(0.4, pinchZoomStart * (dist / pinchDistStart)), 4.0);
            }
            atualizarTransform();
        }, { passive: false });

        viewport.addEventListener('touchend', () => { isDragging = false; });

        // CLIQUE LONGO PARA MARCAR NO CHÃO
        let longPressTimer;
        viewport.addEventListener('touchstart', (e) => {
            if(e.touches.length === 1) {
                longPressTimer = setTimeout(() => {
                    const touchPxX = (e.touches[0].pageX - mapX) / zoom;
                    const touchPxY = (e.touches[0].pageY - mapY) / zoom;
                    const coords = pixelsToGta(touchPxX, touchPxY);
                    gpsParaLocal(coords.x, coords.y);
                }, 600); // 600ms segurando = marcar
            }
        });
        viewport.addEventListener('touchend', () => clearTimeout(longPressTimer));
        viewport.addEventListener('touchmove', () => clearTimeout(longPressTimer));

        // ==========================================
        // COMUNICAÇÃO COM O SERVIDOR (GECKOJU)
        // ==========================================

        function gpsParaLocal(x, y) {
            const pos = gtaToPixels(x, y);
            
            // Foca visualmente
            zoom = 1.6;
            mapX = (window.innerWidth / 2) - (pos.x * zoom);
            mapY = (window.innerHeight / 2) - (pos.y * zoom);
            atualizarTransform();

            // Coloca o pino
            marcador.style.left = pos.x + 'px';
            marcador.style.top = pos.y + 'px';
            marcador.style.display = 'block';

            // ENVIA PARA O SERVIDOR (MOBILE)
            if (window.geckoju) {
                window.geckoju.send(`gps:${x},${y}`);
            } else {
                console.log(`[TESTE] Enviando GPS: ${x}, ${y}`);
            }
        }

        function fecharMapa() {
            if (window.geckoju) {
                window.geckoju.send("fecharMapaGlobal");
            } else {
                document.body.style.display = 'none'; // Teste PC
            }
        }

        // RECEBE DADOS DO SERVIDOR
        if (window.geckoju) {
            window.geckoju.onData = function(data) {
                try {
                    const obj = JSON.parse(data);
                    
                    // Se o servidor mandou uma rota (linha roxa)
                    if (obj.string_rota) {
                        atualizarRota(obj.string_rota);
                    }
                } catch(e) {}
            };
        }

        function atualizarRota(pathData) {
            const path = document.getElementById('gps-path');
            if (!pathData || pathData === "0") {
                path.setAttribute('points', ""); 
                return;
            }
            const pontos = pathData.split('|');
            let svgPoints = "";
            pontos.forEach(p => {
                const c = p.split(',');
                if (c.length === 2) {
                    const pos = gtaToPixels(parseFloat(c[0]), parseFloat(c[1]));
                    svgPoints += `${pos.x},${pos.y} `;
                }
            });
            path.setAttribute('points', svgPoints);
        }

        function atualizarTransform() {
            container.style.transform = `translate(${mapX}px, ${mapY}px) scale(${zoom})`;
            // Mantém o marcador no tamanho certo invertendo o zoom
            marcador.style.transform = `translate(-50%, -50%) scale(${1/zoom})`;
        }

        // Centraliza ao iniciar
        window.onload = () => {
            mapX = (window.innerWidth / 2) - (OFFSET * zoom);
            mapY = (window.innerHeight / 2) - (OFFSET * zoom);
            atualizarTransform();
        };
    </script>
</body>
</html>

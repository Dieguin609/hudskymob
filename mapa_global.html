<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa Global SkyPixel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
        body { background-color: #000; overflow: hidden; width: 100vw; height: 100vh; }

        /* Viewport para arrastar o mapa com o dedo */
        #viewport { width: 100%; height: 100%; position: absolute; overflow: hidden; }

        /* Container do Mapa (Igual o tamanho do seu radar: 2500px) */
        #map-container {
            width: 2500px; height: 2500px;
            position: absolute; transform-origin: 0 0;
            will-change: transform;
        }

        #map-img {
            width: 100%; height: 100%;
            background-image: url('map.png');
            background-size: 100% 100%;
        }

        /* SVG DA ROTA - COPIADO DO RADAR */
        #gps-svg {
            position: absolute; top: 0; left: 0;
            width: 2500px; height: 2500px;
            z-index: 10; pointer-events: none;
            overflow: visible;
        }

        /* SETA DO JOGADOR */
        #player-marker {
            position: absolute; width: 30px; height: 30px;
            background-image: url('seta.png');
            background-size: contain; background-repeat: no-repeat;
            z-index: 20; transform: translate(-50%, -50%);
            display: none; 
        }

        .btn-fechar {
            position: absolute; top: 20px; right: 20px;
            padding: 15px 25px; background: rgba(255, 0, 0, 0.8);
            color: white; font-weight: bold; border-radius: 8px; z-index: 100;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="map-container">
            <div id="map-img"></div>
            
            <svg id="gps-svg" viewBox="0 0 2500 2500">
                <polyline id="gps-path" points="" fill="none" stroke="#bf00ff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

            <div id="player-marker"></div>
        </div>
    </div>

    <div class="btn-fechar" onclick="fecharMapa()">FECHAR (X)</div>

    <script>
        // --- CONSTANTES DO SEU RADAR ---
        const SCALE = 2500 / 6000;
        const OFFSET = 1250;

        let mapX = -1250, mapY = -1250, zoom = 0.5;
        let isDragging = false, startX, startY;

        const container = document.getElementById('map-container');
        const marker = document.getElementById('player-marker');
        const gpsPath = document.getElementById('gps-path');

        function atualizarTransform() {
            container.style.transform = `translate(${mapX}px, ${mapY}px) scale(${zoom})`;
        }

        function fecharMapa() {
            if(window.geckoju) window.geckoju.send("fecharMapaGlobal");
        }

        // --- LÓGICA DE DADOS IGUAL AO RADAR ---
        function Conectar() {
            if(!window.geckoju) { setTimeout(Conectar, 200); return; }

            window.geckoju.onData = function(data) {
                try {
                    const obj = JSON.parse(data);

                    // 1. POSIÇÃO DA SETA
                    let px_raw = (obj.x !== undefined) ? obj.x : obj.pX;
                    let py_raw = (obj.y !== undefined) ? obj.y : obj.pY;
                    let pa = (obj.a !== undefined) ? obj.a : obj.pAngle;

                    if (px_raw !== undefined && py_raw !== undefined) {
                        // MATEMÁTICA DO RADAR: 1250 + (COORD * SCALE)
                        let px = OFFSET + (px_raw * SCALE);
                        let py = OFFSET - (py_raw * SCALE);
                        
                        marker.style.display = 'block';
                        marker.style.left = px + 'px';
                        marker.style.top = py + 'px';

                        if(pa !== undefined) {
                            marker.style.transform = `translate(-50%, -50%) rotate(${pa}deg)`;
                        }

                        // Centraliza o mapa no player ao abrir
                        if(obj.first_open) {
                            mapX = (window.innerWidth / 2) - (px * zoom);
                            mapY = (window.innerHeight / 2) - (py * zoom);
                            atualizarTransform();
                        }
                    }

                    // 2. ROTA GPS (Decodificação idêntica ao Radar)
                    if(obj.string_rota) {
                        let pontos = obj.string_rota.split('|');
                        let svgStr = "";
                        pontos.forEach(p => {
                            let c = p.split(',');
                            if(c.length >= 2) {
                                let rx = OFFSET + (parseFloat(c[0]) * SCALE);
                                let ry = OFFSET - (parseFloat(c[1]) * SCALE);
                                svgStr += `${rx.toFixed(1)},${ry.toFixed(1)} `;
                            }
                        });
                        gpsPath.setAttribute('points', svgStr);
                    } else if(obj.gps_off) {
                        gpsPath.setAttribute('points', "");
                    }

                } catch(e) {}
            };
        }

        // --- CONTROLES DE ARRASTE ---
        const viewport = document.getElementById('viewport');
        viewport.addEventListener('touchstart', e => {
            isDragging = true;
            startX = e.touches[0].pageX - mapX;
            startY = e.touches[0].pageY - mapY;
        });
        viewport.addEventListener('touchmove', e => {
            if(!isDragging) return;
            mapX = e.touches[0].pageX - startX;
            mapY = e.touches[0].pageY - startY;
            atualizarTransform();
        });
        viewport.addEventListener('touchend', () => isDragging = false);

        Conectar();
        atualizarTransform();
    </script>
</body>
</html>

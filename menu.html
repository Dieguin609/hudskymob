<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        
        body {
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center;
            font-family: 'Oswald', sans-serif; overflow: hidden;
            color: white;
        }

        /* TÍTULO EXTERNO */
        .page-header-title {
            position: absolute;
            top: 0%; 
            left: 12%; 
            font-size: 70px; 
            font-weight: 700;
            text-transform: uppercase; 
            letter-spacing: -2px;
            opacity: 0.9;
            z-index: 10;
        }

        /* BOTÃO FECHAR (X) SEMI-TRANSPARENTE */
        .close-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 45px; height: 45px;
            background: rgba(0, 0, 0, 0.3); /* Preto suave */
            color: rgba(255, 255, 255, 0.6); /* Branco transparente */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            z-index: 100;
        }

        .close-btn:active {
            background: #ff4444;
            color: white;
            transform: scale(0.95);
        }

        .wrapper { width: 90%; max-width: 1000px; display: flex; flex-direction: column; }

        /* ABAS */
        .tabs-strip {
            width: 100%; background: #000;
            display: flex; padding: 0 10px;
            border-bottom: 3px solid rgba(255,255,255,0.05);
        }

        .tab-btn {
            padding: 12px 25px;
            color: rgba(255,255,255,0.3);
            font-size: 15px; font-weight: 500;
            text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; position: relative;
        }

        .tab-btn.active { color: #fff; }
        .tab-btn.active::after {
            content: ''; position: absolute; bottom: 0; left: 0;
            width: 100%; height: 3px; background: #fff;
        }

        /* CONTEÚDO */
        .main-box {
            width: 100%; height: 50vh;
            background: rgba(0, 0, 0, 0.9);
            margin-top: 10px; border: 1px solid rgba(255,255,255,0.03);
            overflow: hidden;
        }

        .page { display: none; width: 100%; height: 100%; }
        .page.active { display: block; }

        /* LISTA DE OPÇÕES */
        .settings-list { padding: 25px 40px; height: 100%; overflow-y: auto; }
        
        .opt-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 14px; font-weight: 300; text-transform: uppercase;
            cursor: pointer; transition: 0.1s; color: #aaa;
        }
        .opt-row:hover { background: #fff; color: #000; font-weight: 700; }

        /* MINIATURA DO MAPA (CLICÁVEL) */
        .map-prev {
            width: 100%; height: 100%;
            background-image: url('map.png'); background-size: cover;
            background-position: center; opacity: 0.8;
            cursor: pointer;
            transition: 0.2s;
        }
        .map-prev:hover { opacity: 1; transform: scale(1.02); }

        .map-label {
            position: absolute; bottom: 20px; left: 20px;
            background: #000; padding: 10px 20px;
            border-left: 4px solid #bf00ff; font-size: 14px; font-weight: 700;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="page-header-title" id="head-title">MAPA</div>
    
    <div class="close-btn" onclick="send('fechar_menu')">✕</div>

    <div class="wrapper">
        <div class="tabs-strip">
            <div class="tab-btn active" onclick="nav('mapa', this)">MAPA</div>
            <div class="tab-btn" onclick="nav('hud', this)">HUD</div>
            <div class="tab-btn" onclick="nav('graficos', this)">GRÁFICOS</div>
            <div class="tab-btn" onclick="nav('audio', this)">ÁUDIO</div>
            <div class="tab-btn" onclick="nav('geral', this)">GERAL</div>
        </div>

        <div class="main-box">
            <div id="p-mapa" class="page active">
                <div class="map-prev" onclick="send('abrir_mapa_global')"></div>
                <div class="map-label">CLIQUE PARA ABRIR O MAPA GLOBAL</div>
            </div>

            <div id="p-hud" class="page">
                <div class="settings-list">
                    <div class="opt-row" onclick="send('edit_hud_sa')">
                        <span>EDITAR POSIÇÃO DOS BOTÕES</span>
                        <i class="fas fa-arrows-alt"></i>
                    </div>
                    <div class="opt-row" onclick="cycle('walk_mode', ['ANALOGICO', 'SETAS', 'MIXTO'])">
                        <span>MODO DE ANDAR</span>
                        <span id="walk_mode">ANALOGICO</span>
                    </div>
                    <div class="opt-row" onclick="send('reset_hud_default')" style="color:#ff4444">
                        <span>RESTAURAR PADRÃO</span>
                    </div>
                </div>
            </div>

            <div id="p-graficos" class="page"><div class="settings-list"><div class="opt-row"><span>EM BREVE</span></div></div></div>
            <div id="p-audio" class="page"><div class="settings-list"><div class="opt-row"><span>EM BREVE</span></div></div></div>
            <div id="p-geral" class="page">
                <div class="settings-list">
                    <div class="opt-row" onclick="send('fechar_menu')" style="color:#ff4444">
                        <span>FECHAR MENU</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function nav(name, el) {
            document.getElementById('head-title').innerText = name;
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('p-' + name).classList.add('active');
        }

        function cycle(id, options) {
            let el = document.getElementById(id);
            let current = options.indexOf(el.innerText);
            let next = (current + 1) % options.length;
            el.innerText = options[next];
            send("cycle_" + id + ":" + options[next]);
        }

        function send(cmd) { 
            if(window.geckoju) window.geckoju.send(cmd);
        }
    </script>
</body>
</html>

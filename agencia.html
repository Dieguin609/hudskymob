<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary: #3498db; 
            --bg-dark: rgba(10, 10, 10, 0.95);
            --card-bg: rgba(20, 20, 20, 1);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: transparent; /* FUNDO REMOVIDO PARA MOSTRAR O JOGO */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            width: 880px; /* Um pouco mais largo que a prefeitura */
            height: 480px; /* Altura reduzida para caber bem na tela */
            background: var(--bg-dark);
            border-radius: 12px;
            border: 1px solid rgba(52, 152, 219, 0.3);
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px); /* Efeito de vidro igual da prefeitura */
            transform: scale(0.85); /* Deixa proporcional no mobile */
            transform-origin: center;
        }

        .header {
            padding: 15px 25px; /* Reduzido para ganhar espaço */
            background: rgba(52, 152, 219, 0.05);
            border-bottom: 4px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { margin: 0; font-size: 20px; text-transform: uppercase; font-weight: 900; }
        .user-stats { font-size: 15px; color: var(--primary); font-weight: bold; display: flex; align-items: center;}

        .job-slider {
            flex: 1;
            padding: 25px 20px;
            display: flex;
            flex-direction: row; 
            gap: 20px;
            overflow-x: auto; 
            overflow-y: hidden; 
            scroll-behavior: smooth;
        }

        .job-totem {
            min-width: 250px; /* Ligeiramente mais fino pra caber melhor */
            max-width: 250px;
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
            height: 100%; 
        }

        .job-totem:hover {
            border-color: var(--primary);
            background: #181818;
            transform: scale(1.02);
        }

        .job-img {
            width: 100%;
            height: 140px; 
            object-fit: cover;
            border-bottom: 4px solid #333;
        }

        .job-totem.unlocked .job-img { border-bottom-color: var(--primary); }

        .job-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: flex-start;
        }

        .job-content h3 { 
            margin: 0; 
            font-size: 16px; 
            color: #fff; 
            text-transform: uppercase; 
            text-align: center; 
            font-weight: 800;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .job-content p { 
            margin: 8px 0; 
            font-size: 11px; 
            color: #aaa; 
            line-height: 1.4; 
            text-align: center;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 46px;
        }

        .job-footer {
            padding: 12px;
            text-align: center;
            background: rgba(0,0,0,0.2);
            margin-top: auto;
            min-height: 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .lvl-tag {
            font-size: 10px;
            color: var(--primary);
            font-weight: 800;
            margin-bottom: 10px;
            display: block;
            letter-spacing: 1px;
        }

        .btn-apply {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            transition: 0.2s;
        }

        .job-totem.unlocked .btn-apply {
            background: var(--primary);
            border: none;
            color: #000;
        }

        .job-slider::-webkit-scrollbar { height: 6px; }
        .job-slider::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1 id="player-name">CARREGANDO...</h1>
            <p id="player-docs" style="margin: 5px 0 0; font-size: 12px; color: #aaa; font-weight: 600;">CPF: Aguardando | CLT: Aguardando</p>
        </div>
        <div class="user-stats">
            <span id="player-lvl">NÍVEL: 1</span>
        </div>
        <button onclick="closeUI()" style="background:none; border:none; color:white; cursor:pointer; font-size:28px; margin-left: 20px;">&times;</button>
    </div>

    <div class="job-slider" id="job-list"></div>
</div>

<script>
    const jobs = [
        { id: 1, name: "Servidor Público", desc: "Manutenção e limpeza das vias públicas de Moc. Ajude a manter a cidade impecável.", lvl: 1, img: "gari.jpg" },
        { id: 2, name: "Repositor BH", desc: "Abasteça as prateleiras no Supermercados BH e organize o estoque.", lvl: 1, img: "repositor.jpg" },
        { id: 3, name: "Operador VGX", desc: "Atendimento e suporte no Call Center da VGX Montes Claros.", lvl: 2, img: "tele.jpg" },
        { id: 4, name: "Eletricista CEMIG", desc: "Trabalhe na manutenção da rede elétrica e reparos de iluminação urbana.", lvl: 5, img: "Cemig.jpg" },
        { id: 5, name: "Motorista MocBus", desc: "Opere as linhas de transporte coletivo urbano em toda a cidade.", lvl: 8, img: "mocbus.jpg" },
        { id: 6, name: "Entregador Sedex", desc: "Entregas e logística para os Correios e Sedex regional.", lvl: 12, img: "sedex.jpg" },
        { id: 7, name: "Caminhoneiro Sedex", desc: "Entregas pesadas e logística para os Correios e Sedex Nacional.", lvl: 15, img: "sedexcaminhao.jpg" },
        { id: 8, name: "Caminhoneiro Petrobras", desc: "Entregas de Gasolina e Diesel a partir da Petrobras para o País!", lvl: 12, img: "pretobras.jpg" }
    ];

    // A função agora pede Nome, CPF e CLT.
    function init(nome, cpf, clt) {
        
        let levelEstatico = 1; // DEIXEI O LEVEL ESTÁTICO AQUI COMO PEDIU!
        
        // Trata os textos caso o cara não tenha documento
        let displayCpf = (!cpf || cpf === "Nenhum") ? "Nenhum" : cpf;
        let displayClt = (!clt || clt === "Nao Assinada" || clt === "Nenhum") ? "Nenhuma" : clt;

        // Atualiza a tela
        document.getElementById('player-name').innerText = nome.toUpperCase();
        document.getElementById('player-docs').innerText = `CPF: ${displayCpf} | CLT: ${displayClt}`;
        document.getElementById('player-lvl').innerText = `NÍVEL: ${levelEstatico}`;
        
        const slider = document.getElementById('job-list');
        slider.innerHTML = '';

        jobs.forEach(job => {
            const locked = levelEstatico < job.lvl;
            slider.innerHTML += `
                <div class="job-totem ${locked ? '' : 'unlocked'}">
                    <img src="${job.img}" class="job-img" onerror="this.src='https://via.placeholder.com/260x160?text=Emprego'">
                    <div class="job-content">
                        <h3>${job.name}</h3>
                        <p>${job.desc}</p>
                    </div>
                    <div class="job-footer">
                        <span class="lvl-tag">REQUISITO: NÍVEL ${job.lvl}</span>
                        <button class="btn-apply" ${locked ? 'disabled' : ''} onclick="chooseJob(${job.id})">
                            ${locked ? 'BLOQUEADO' : 'CANDIDATAR'}
                        </button>
                    </div>
                </div>
            `;
        });
    }

    function chooseJob(id) { if(window.geckoju) window.geckoju.send("job_" + id); }
    function closeUI() { if(window.geckoju) window.geckoju.send("job_close"); }

    // Simulação para testar no navegador:
    init("Diego", "123.456.789-10", "15987-MG"); 
</script>
</body>
</html>

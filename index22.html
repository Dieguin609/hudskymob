<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..400,1,1" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            background: transparent !important; 
            overflow: hidden; 
            width: 100%;
            height: 100%;
            /* TRAVA DE TOQUE NA TELA */
            touch-action: none; 
            user-select: none;
        }
        
        /* Onde a HUD fica posicionada (Embaixo na esquerda) */
        .hud-bottom-left {
            position: absolute;
            bottom: 15px;
            left: 15px;
            display: flex;
            gap: 5px; /* Deixei um milímetro mais junto também */
        }
        
        /* O fundo escuro do quadradinho - AGORA UM POUCO MENOR */
        .status-box {
            width: 30px;  /* Reduzido de 36px para 30px */
            height: 30px; /* Reduzido de 36px para 30px */
            background-color: rgba(0, 0, 0, 0.65); 
            border-radius: 5px; /* Ajustei a borda pro novo tamanho */
            position: relative;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* A cor que preenche o quadradinho e "desce" */
        .status-fill {
            position: absolute;
            bottom: 0; 
            left: 0;
            width: 100%;
            height: 100%; 
            transition: height 0.3s ease-out; 
        }
        
        /* As cores de cada status */
        .fill-health { background-color: #FF1493; } /* Rosa choque/Pink */
        .fill-armor  { background-color: #1E90FF; } /* Azul do Colete */
        .fill-hunger { background-color: #FF8C00; } /* Laranja da Fome */
        .fill-thirst { background-color: #00BFFF; } /* Azul claro da Sede */
        
        /* O Ícone que fica por cima da cor - AGORA UM POUCO MENOR */
        .status-icon {
            position: relative;
            z-index: 2; 
            color: rgba(255, 255, 255, 0.95);
            font-size: 17px; /* Reduzido de 20px para 17px pra caber certinho */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8); 
        }
    </style>
</head>
<body>

    <div class="hud-bottom-left">
        <div class="status-box">
            <div class="status-fill fill-health" id="fill-health" style="height: 100%;"></div>
            <span class="material-symbols-outlined status-icon">favorite</span>
        </div>

        <div class="status-box">
            <div class="status-fill fill-armor" id="fill-armor" style="height: 100%;"></div>
            <span class="material-symbols-outlined status-icon">security</span>
        </div>

        <div class="status-box">
            <div class="status-fill fill-hunger" id="fill-hunger" style="height: 100%;"></div>
            <span class="material-symbols-outlined status-icon">restaurant</span>
        </div>

        <div class="status-box">
            <div class="status-fill fill-thirst" id="fill-thirst" style="height: 100%;"></div>
            <span class="material-symbols-outlined status-icon">water_drop</span>
        </div>
    </div>

    <script>
        // Função que altera a altura da corzinha dentro do quadrado
        function setFill(id, percent) {
            const el = document.getElementById(id);
            if (!el) return;
            // Garante que o valor não passe de 100 nem seja menor que 0
            percent = Math.max(0, Math.min(100, percent));
            el.style.height = percent + '%';
        }

        // Recebe os dados do servidor SAMP
        if (window.geckoju) {
            window.geckoju.onData = function(data) {
                try {
                    const obj = JSON.parse(data);
                    
                    if(obj.health !== undefined) setFill('fill-health', obj.health);
                    if(obj.armor !== undefined) setFill('fill-armor', obj.armor);
                    if(obj.hunger !== undefined) setFill('fill-hunger', obj.hunger);
                    if(obj.thirst !== undefined) setFill('fill-thirst', obj.thirst); 
                    
                } catch(e) {}
            };
        }
    </script>
</body>
</html>

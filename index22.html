<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..400,1,1" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            background: transparent !important; 
            overflow: hidden; 
            width: 100%;
            height: 100%;
            touch-action: none; 
            user-select: none;
        }
        
        /* 1. HUD DE STATUS COMPLETO (Canto Inferior Esquerdo: Vida, Colete, Fome, Sede) */
        .hud-bottom-left {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        
        .status-box {
            width: 36px; 
            height: 36px; 
            background: rgba(12, 12, 18, 0.75); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 10px; 
            position: relative;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .status-fill {
            position: absolute;
            bottom: 0; 
            left: 0;
            width: 100%;
            height: 100%; 
            transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        .fill-health { background-color: rgba(255, 20, 147, 0.5); }
        .fill-armor  { background-color: rgba(30, 144, 255, 0.5); } 
        .fill-hunger { background-color: rgba(255, 140, 0, 0.5); }
        .fill-thirst { background-color: rgba(0, 191, 255, 0.5); } 
        
        .status-icon {
            position: relative;
            z-index: 2; 
            color: #ffffff;
            font-size: 18px; 
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6); 
        }

        /* 2. VELOCÍMETRO CENTRAL E BARRAS CURVAS SUPERIORES (Motor e Gasolina) */
        .speedo-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .speedo-svg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .speedo-center-content {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .speed-text {
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 36px;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        .speed-kmh {
            font-family: 'Rajdhani', sans-serif;
            font-size: 9px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
            margin-top: 2px;
        }

        /* 3. BOTÕES INFERIORES (Incluindo Vida, Colete, Fome, Sede, Chave, Cinto, Marcha, Farol, Freio, Setas) */
        .indicators-row {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 3px;
            z-index: 5;
        }

        .ind-btn {
            width: 25px;
            height: 25px;
            background: rgba(15, 15, 20, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }

        .ind-btn span {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            transition: color 0.3s ease;
        }

        /* Estado Vermelho Alerta / Ativo dos Botões */
        .ind-btn.active {
            background: rgba(210, 20, 20, 0.95);
            border-color: rgba(255, 50, 50, 0.6);
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.6);
        }

        .ind-btn.active span {
            color: #ffffff;
            text-shadow: 0 0 6px #ffffff;
        }

        /* Pisca-alerta verde para as setas */
        .ind-btn.blink-active {
            background: rgba(0, 210, 100, 0.95);
            border-color: rgba(0, 255, 120, 0.6);
            box-shadow: 0 0 12px rgba(0, 255, 100, 0.8);
        }
        .ind-btn.blink-active span {
            color: #ffffff;
            text-shadow: 0 0 6px #ffffff;
        }
    </style>
</head>
<body>

    <!-- HUD DE STATUS COMPLETO (Canto Inferior Esquerdo) -->
    <div class="hud-bottom-left" id="lifeHUD">
        <div class="status-box">
            <div class="status-fill fill-health" id="fill-health" style="height: 100%;"></div>
            <span class="material-symbols-outlined status-icon">favorite</span>
        </div>
        <div class="status-box">
            <div class="status-fill fill-armor" id="fill-armor" style="height: 100%;"></div>
            <span class="material-symbols-outlined status-icon">security</span>
        </div>
        <div class="status-box">
            <div class="status-fill fill-hunger" id="fill-hunger" style="height: 100%;"></div>
            <span class="material-symbols-outlined status-icon">restaurant</span>
        </div>
        <div class="status-box">
            <div class="status-fill fill-thirst" id="fill-thirst" style="height: 100%;"></div>
            <span class="material-symbols-outlined status-icon">water_drop</span>
        </div>
    </div>

    <!-- VELOCÍMETRO COM BARRAS CURVAS SUPERIORES E TODOS OS ÍCONES DUPLICADOS ABAIXO -->
    <div class="speedo-container" id="speedoHUD">
        
        <svg class="speedo-svg-container" viewBox="0 0 180 180">
            <!-- 1. Fundo do Arco de Velocidade -->
            <circle cx="90" cy="90" r="65" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="6"></circle>
            
            <!-- 2. Progresso do Arco de Velocidade (Cyan) -->
            <circle id="speed-ring" cx="90" cy="90" r="65" fill="none" stroke="#00d2ff" stroke-width="7" stroke-linecap="round"
                stroke-dasharray="408" stroke-dashoffset="408" transform="rotate(-90 90 90)"
                style="filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.6)); transition: stroke-dashoffset 0.15s ease;">
            </circle>

            <!-- 3. Barrinha Curva Superior Esquerda: Gasolina -->
            <path d="M 42 58 A 65 65 0 0 1 78 28" fill="none" stroke="rgba(0,0,0,0.6)" stroke-width="5" stroke-linecap="round"/>
            <path id="path-fuel" d="M 42 58 A 65 65 0 0 1 78 28" fill="none" stroke="#ffaa00" stroke-width="5" stroke-linecap="round"
                stroke-dasharray="45" stroke-dashoffset="0" style="filter: drop-shadow(0 0 5px rgba(255,170,0,0.5)); transition: stroke-dashoffset 0.3s ease;"/>

            <!-- 4. Barrinha Curva Superior Direita: Motor / Óleo -->
            <path d="M 102 28 A 65 65 0 0 1 138 58" fill="none" stroke="rgba(0,0,0,0.6)" stroke-width="5" stroke-linecap="round"/>
            <path id="path-oil" d="M 102 28 A 65 65 0 0 1 138 58" fill="none" stroke="#00ffaa" stroke-width="5" stroke-linecap="round"
                stroke-dasharray="45" stroke-dashoffset="0" style="filter: drop-shadow(0 0 5px rgba(0,255,170,0.5)); transition: stroke-dashoffset 0.3s ease;"/>
        </svg>

        <!-- Miolo central com números -->
        <div class="speedo-center-content">
            <span class="speed-text" id="text-speed">00</span>
            <span class="speed-kmh">KM/H</span>
        </div>

        <!-- Ícones Redondos Inferiores (Todos duplicados/inclusos) -->
        <div class="indicators-row">
            <!-- Seta Esquerda -->
            <div class="ind-btn" id="btn-turn-left" title="Seta Esquerda">
                <span class="material-symbols-outlined">chevron_left</span>
            </div>
            <!-- Vida (Duplicado) -->
            <div class="ind-btn" id="btn-health-hud" title="Vida">
                <span class="material-symbols-outlined">favorite</span>
            </div>
            <!-- Colete (Duplicado) -->
            <div class="ind-btn" id="btn-armor-hud" title="Colete">
                <span class="material-symbols-outlined">security</span>
            </div>
            <!-- Cinto de Segurança -->
            <div class="ind-btn active" id="btn-seatbelt" title="Cinto de Segurança">
                <span class="material-symbols-outlined">airline_seat_recline_normal</span>
            </div>
            <!-- Fome (Duplicado) -->
            <div class="ind-btn" id="btn-hunger-hud" title="Fome">
                <span class="material-symbols-outlined">restaurant</span>
            </div>
            <!-- Sede (Duplicado) -->
            <div class="ind-btn" id="btn-thirst-hud" title="Sede">
                <span class="material-symbols-outlined">water_drop</span>
            </div>
            <!-- Tranca / Chave do Veículo -->
            <div class="ind-btn" id="btn-lock" title="Trancar/Destrancar Veículo">
                <span class="material-symbols-outlined">lock</span>
            </div>
            <!-- Marcha -->
            <div class="ind-btn" id="btn-gear" style="background: rgba(15,15,20,0.9); border: 1px solid rgba(255,255,255,0.1);">
                <span style="font-size: 10px; font-weight: bold; color: #fff; font-family: 'Rajdhani';" id="gear-text">N</span>
            </div>
            <!-- Farol -->
            <div class="ind-btn" id="btn-lights" title="Farol">
                <span class="material-symbols-outlined">light_mode</span>
            </div>
            <!-- Freio de Mão -->
            <div class="ind-btn" id="btn-handbrake" title="Freio de Mão">
                <span class="material-symbols-outlined">radio_button_checked</span>
            </div>
            <!-- Seta Direita -->
            <div class="ind-btn" id="btn-turn-right" title="Seta Direita">
                <span class="material-symbols-outlined">chevron_right</span>
            </div>
        </div>

    </div>

    <script>
        function setFill(id, percent) {
            const el = document.getElementById(id);
            if (!el) return;
            percent = Math.max(0, Math.min(100, percent));
            el.style.height = percent + '%';
        }

        function handleIncomingData(data) {
            try {
                const obj = typeof data === 'string' ? JSON.parse(data) : data;
                if (!obj) return;
                
                // Status do Jogador (Canto Inferior Esquerdo)
                if(obj.health !== undefined) setFill('fill-health', obj.health);
                if(obj.armor !== undefined) setFill('fill-armor', obj.armor);
                if(obj.hunger !== undefined) setFill('fill-hunger', obj.hunger);
                if(obj.thirst !== undefined) setFill('fill-thirst', obj.thirst); 

                // Alertas Vermelhos nos ícones abaixo do velocímetro se estiverem baixos (< 20%)
                if(obj.health !== undefined) {
                    const hHud = document.getElementById('btn-health-hud');
                    if(obj.health <= 20) hHud.classList.add('active');
                    else hHud.classList.remove('active');
                }
                if(obj.armor !== undefined) {
                    const aHud = document.getElementById('btn-armor-hud');
                    if(obj.armor <= 20 && obj.armor > 0) aHud.classList.add('active');
                    else aHud.classList.remove('active');
                }
                if(obj.hunger !== undefined) {
                    const hgHud = document.getElementById('btn-hunger-hud');
                    if(obj.hunger <= 20) hgHud.classList.add('active');
                    else hgHud.classList.remove('active');
                }
                if(obj.thirst !== undefined) {
                    const tHud = document.getElementById('btn-thirst-hud');
                    if(obj.thirst <= 20) tHud.classList.add('active');
                    else tHud.classList.remove('active');
                }

                // Velocímetro e Arco Principal (Max 200 km/h)
                if(obj.speed !== undefined) {
                    let speedVal = Math.floor(obj.speed);
                    document.getElementById('text-speed').innerText = speedVal;
                    
                    let ring = document.getElementById('speed-ring');
                    let circumference = 408;
                    let maxSpeed = 200;
                    let offset = circumference - (Math.min(speedVal, maxSpeed) / maxSpeed) * circumference;
                    ring.style.strokeDashoffset = offset;
                }

                // Barrinha Curva Superior Esquerda (Gasolina)
                if(obj.fuel !== undefined) {
                    let fuelPercent = Math.max(0, Math.min(100, obj.fuel));
                    let maxDash = 45;
                    let offsetFuel = maxDash - (fuelPercent / 100) * maxDash;
                    document.getElementById('path-fuel').style.strokeDashoffset = offsetFuel;
                }

                // Barrinha Curva Superior Direita (Motor / Óleo)
                if(obj.oil !== undefined) {
                    let oilPercent = Math.max(0, Math.min(100, obj.oil));
                    let maxDash = 45;
                    let offsetOil = maxDash - (oilPercent / 100) * maxDash;
                    document.getElementById('path-oil').style.strokeDashoffset = offsetOil;
                }

                // Cinto de Segurança (Vermelho se false/0)
                if(obj.seatbelt !== undefined) {
                    const sb = document.getElementById('btn-seatbelt');
                    if(obj.seatbelt === true || obj.seatbelt === 1) {
                        sb.classList.remove('active');
                    } else {
                        sb.classList.add('active');
                    }
                }

                // Chave / Tranca do Veículo
                if(obj.locked !== undefined) {
                    const lk = document.getElementById('btn-lock');
                    const icon = lk.querySelector('span');
                    if(obj.locked === true || obj.locked === 1) {
                        lk.classList.add('active');
                        icon.innerText = 'lock';
                    } else {
                        lk.classList.remove('active');
                        icon.innerText = 'lock_open';
                    }
                }

                // Farol
                if(obj.lights !== undefined) {
                    const lt = document.getElementById('btn-lights');
                    if(obj.lights === true || obj.lights === 1) {
                        lt.classList.add('active');
                    } else {
                        lt.classList.remove('active');
                    }
                }

                // Freio de Mão
                if(obj.handbrake !== undefined) {
                    const hb = document.getElementById('btn-handbrake');
                    if(obj.handbrake === true || obj.handbrake === 1) {
                        hb.classList.add('active');
                    } else {
                        hb.classList.remove('active');
                    }
                }

                // Marcha
                if(obj.gear !== undefined) {
                    document.getElementById('gear-text').innerText = obj.gear;
                }

                // Setas
                if(obj.turnLeft !== undefined) {
                    const tl = document.getElementById('btn-turn-left');
                    if(obj.turnLeft) tl.classList.add('blink-active');
                    else tl.classList.remove('blink-active');
                }
                if(obj.turnRight !== undefined) {
                    const tr = document.getElementById('btn-turn-right');
                    if(obj.turnRight) tr.classList.add('blink-active');
                    else tr.classList.remove('blink-active');
                }
            } catch(e) {
                console.error("Erro no parse dos dados da HUD: ", e);
            }
        }

        // Conexão Geckoju
        if (window.geckoju) {
            window.geckoju.onData = function(data) {
                handleIncomingData(data);
            };
        }

        // Conexão Padrão Browser
        window.addEventListener('message', function(event) {
            handleIncomingData(event.data);
        });
    </script>
</body>
</html>

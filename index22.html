<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..400,1,1" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            background: transparent !important; 
            overflow: hidden; 
            width: 100%;
            height: 100%;
            touch-action: none; 
            user-select: none;
        }
        
        .hud-bottom-left {
            position: absolute;
            bottom: 10px;
            left: 10px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        
        .status-box {
            width: 36px; 
            height: 36px; 
            background: rgba(12, 12, 18, 0.9); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 10px; 
            position: relative;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .status-fill {
            position: absolute;
            bottom: 0; 
            left: 0;
            width: 100%;
            height: 100%; 
            transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        
        .fill-health { background-color: #FF0033; }
        .fill-armor  { background-color: #0066FF; }
        .fill-hunger { background-color: #FF6600; }
        .fill-thirst { background-color: #00CCFF; }
        
        .status-icon {
            position: relative;
            z-index: 2; 
            color: #ffffff;
            font-size: 18px; 
        }
    </style>
</head>
<body>

    <div class="hud-bottom-left" id="lifeHUD">
        <div class="status-box">
            <div class="status-fill fill-health" id="fill-health" style="height: 100%;"></div>
            <span class="material-symbols-outlined status-icon">favorite</span>
        </div>
        <div class="status-box">
            <div class="status-fill fill-armor" id="fill-armor" style="height: 100%;"></div>
            <span class="material-symbols-outlined status-icon">security</span>
        </div>
        <div class="status-box">
            <div class="status-fill fill-hunger" id="fill-hunger" style="height: 100%;"></div>
            <span class="material-symbols-outlined status-icon">restaurant</span>
        </div>
        <div class="status-box">
            <div class="status-fill fill-thirst" id="fill-thirst" style="height: 100%;"></div>
            <span class="material-symbols-outlined status-icon">water_drop</span>
        </div>
    </div>

    <script>
        function setFill(id, percent) {
            const el = document.getElementById(id);
            if (!el) return;
            percent = Math.max(0, Math.min(100, percent));
            el.style.height = percent + '%';
        }

        function handleIncomingData(data) {
            try {
                const obj = typeof data === 'string' ? JSON.parse(data) : data;
                if (!obj) return;
                
                if(obj.health !== undefined) setFill('fill-health', obj.health);
                if(obj.armor !== undefined) setFill('fill-armor', obj.armor);
                if(obj.hunger !== undefined) setFill('fill-hunger', obj.hunger);
                if(obj.thirst !== undefined) setFill('fill-thirst', obj.thirst); 
            } catch(e) {
                console.error("Erro no parse dos dados de status: ", e);
            }
        }

        if (window.geckoju) {
            window.geckoju.onData = function(data) { handleIncomingData(data); };
        }
        window.addEventListener('message', function(event) { handleIncomingData(event.data); });
    </script>
</body>
</html>

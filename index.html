<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD Parte de Baixo</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200" />
    <style>
        :root {
            --ring-size: 45px; /* Tamanho reduzido conforme solicitado */
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Fundo transparente obrigatório para HUD */
        html, body { 
            background: transparent !important; 
            background-color: transparent !important;
            overflow: hidden; 
        }
        
        .panel {
            position: absolute;
            left: 0; /* Posicionado à esquerda */
            bottom: 0;
            padding: 10px;
        }
        
        .row { display: flex; gap: 8px; align-items: center; }
        
        .ring {
            position: relative;
            width: var(--ring-size);
            height: var(--ring-size);
        }
        
        .ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        
        /* Estilo dos círculos de fundo */
        .ring .bg { stroke: rgba(255, 255, 255, 0.15); fill: rgba(0, 0, 0, 0.4); }
        .ring .fg { 
            transition: stroke-dashoffset 300ms ease; 
            stroke-linecap: round; 
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5)); 
        }
        
        /* Cores dos ícones baseadas na sua imagem */
        .hp .fg { stroke: #ef5350; }      /* Vida: Vermelho */
        .armor .fg { stroke: #ffffff; }   /* Colete: Branco */
        .hunger .fg { stroke: #ffb300; }  /* Fome: Amarelo/Laranja */
        .thirst .fg { stroke: #2196f3; }  /* Sede: Azul */
        .sleep .fg { stroke: #9e9e9e; }   /* Sono: Cinza */

        .label {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
        }

        /* Estilo dos ícones Material */
        .material-symbols-outlined {
            color: #ffffff;
            font-size: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="row">
            <div class="ring hp">
                <svg viewBox="0 0 100 100">
                    <circle class="bg" cx="50" cy="50" r="44" stroke-width="10"/>
                    <circle class="fg" cx="50" cy="50" r="44" id="hpRing" stroke-width="10" fill="none" stroke-dasharray="276" stroke-dashoffset="0"/>
                </svg>
                <div class="label"><span class="material-symbols-outlined">favorite</span></div>
            </div>

            <div class="ring armor">
                <svg viewBox="0 0 100 100">
                    <circle class="bg" cx="50" cy="50" r="44" stroke-width="10"/>
                    <circle class="fg" cx="50" cy="50" r="44" id="armorRing" stroke-width="10" fill="none" stroke-dasharray="276" stroke-dashoffset="276"/>
                </svg>
                <div class="label"><span class="material-symbols-outlined">shield</span></div>
            </div>

            <div class="ring hunger">
                <svg viewBox="0 0 100 100">
                    <circle class="bg" cx="50" cy="50" r="44" stroke-width="10"/>
                    <circle class="fg" cx="50" cy="50" r="44" id="hungerRing" stroke-width="10" fill="none" stroke-dasharray="276" stroke-dashoffset="0"/>
                </svg>
                <div class="label"><span class="material-symbols-outlined">restaurant</span></div>
            </div>

            <div class="ring thirst">
                <svg viewBox="0 0 100 100">
                    <circle class="bg" cx="50" cy="50" r="44" stroke-width="10"/>
                    <circle class="fg" cx="50" cy="50" r="44" id="thirstRing" stroke-width="10" fill="none" stroke-dasharray="276" stroke-dashoffset="0"/>
                </svg>
                <div class="label"><span class="material-symbols-outlined">water_drop</span></div>
            </div>

            <div class="ring sleep">
                <svg viewBox="0 0 100 100">
                    <circle class="bg" cx="50" cy="50" r="44" stroke-width="10"/>
                    <circle class="fg" cx="50" cy="50" r="44" id="sleepRing" stroke-width="10" fill="none" stroke-dasharray="276" stroke-dashoffset="0"/>
                </svg>
                <div class="label"><span class="material-symbols-outlined">bedtime</span></div>
            </div>
        </div>
    </div>

    <script>
        const CIRCUMFERENCE = 2 * Math.PI * 44; 

        function setProgress(id, percent) {
            const circle = document.getElementById(id);
            if (!circle) return;
            percent = Math.max(0, Math.min(100, percent));
            const offset = CIRCUMFERENCE * (1 - percent / 100);
            circle.setAttribute('stroke-dashoffset', offset.toFixed(2));
        }

        // Função para receber dados do Geckoju
        if (window.geckoju) {
            window.geckoju.onData = function(data) {
                try {
                    const obj = JSON.parse(data);
                    if(obj.health !== undefined) setProgress('hpRing', obj.health);
                    if(obj.armor !== undefined) setProgress('armorRing', obj.armor);
                    if(obj.hunger !== undefined) setProgress('hungerRing', obj.hunger);
                    if(obj.thirst !== undefined) setProgress('thirstRing', obj.thirst);
                    if(obj.sleep !== undefined) setProgress('sleepRing', obj.sleep);
                } catch(e) {}
            };
        }
    </script>
</body>
</html>

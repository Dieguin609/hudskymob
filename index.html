<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..400,1,0" />
    <style>
        :root {
            --ring-size: 32px; /* Reduzido para ser discreto */
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Fundo transparente total */
        html, body { 
            background: transparent !important; 
            overflow: hidden; 
            width: 100%;
            height: 100%;
        }
        
        .panel {
            position: absolute;
            left: 2px;
            bottom: 2px;
            display: flex;
            gap: 4px; /* Espaço mínimo entre ícones */
        }
        
        .ring {
            position: relative;
            width: var(--ring-size);
            height: var(--ring-size);
        }
        
        .ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        
        /* Círculos e sombras */
        .ring .bg { stroke: rgba(0, 0, 0, 0.5); fill: rgba(0, 0, 0, 0.3); }
        .ring .fg { 
            transition: stroke-dashoffset 400ms ease; 
            stroke-linecap: round;
        }
        
        /* Cores baseadas na sua imagem */
        .hp .fg { stroke: #ef5350; }
        .armor .fg { stroke: #ffffff; }
        .hunger .fg { stroke: #ffb300; }
        .thirst .fg { stroke: #2196f3; }
        .sleep .fg { stroke: #9e9e9e; }

        .label {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
        }

        .material-symbols-outlined {
            color: #ffffff;
            font-size: 16px; /* Ícone menor para caber na bolinha */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="ring hp">
            <svg viewBox="0 0 100 100">
                <circle class="bg" cx="50" cy="50" r="42" stroke-width="12"/>
                <circle class="fg" cx="50" cy="50" r="42" id="hpRing" stroke-width="12" fill="none" stroke-dasharray="264" stroke-dashoffset="0"/>
            </svg>
            <div class="label"><span class="material-symbols-outlined">favorite</span></div>
        </div>
        <div class="ring armor">
            <svg viewBox="0 0 100 100">
                <circle class="bg" cx="50" cy="50" r="42" stroke-width="12"/>
                <circle class="fg" cx="50" cy="50" r="42" id="armorRing" stroke-width="12" fill="none" stroke-dasharray="264" stroke-dashoffset="264"/>
            </svg>
            <div class="label"><span class="material-symbols-outlined">shield</span></div>
        </div>
        <div class="ring hunger">
            <svg viewBox="0 0 100 100">
                <circle class="bg" cx="50" cy="50" r="42" stroke-width="12"/>
                <circle class="fg" cx="50" cy="50" r="42" id="hungerRing" stroke-width="12" fill="none" stroke-dasharray="264" stroke-dashoffset="0"/>
            </svg>
            <div class="label"><span class="material-symbols-outlined">restaurant</span></div>
        </div>
        <div class="ring thirst">
            <svg viewBox="0 0 100 100">
                <circle class="bg" cx="50" cy="50" r="42" stroke-width="12"/>
                <circle class="fg" cx="50" cy="50" r="42" id="thirstRing" stroke-width="12" fill="none" stroke-dasharray="264" stroke-dashoffset="0"/>
            </svg>
            <div class="label"><span class="material-symbols-outlined">water_drop</span></div>
        </div>
        <div class="ring sleep">
            <svg viewBox="0 0 100 100">
                <circle class="bg" cx="50" cy="50" r="42" stroke-width="12"/>
                <circle class="fg" cx="50" cy="50" r="42" id="sleepRing" stroke-width="12" fill="none" stroke-dasharray="264" stroke-dashoffset="0"/>
            </svg>
            <div class="label"><span class="material-symbols-outlined">bedtime</span></div>
        </div>
    </div>

    <script>
        const CIRCUMFERENCE = 2 * Math.PI * 42; 
        function setProgress(id, percent) {
            const circle = document.getElementById(id);
            if (!circle) return;
            percent = Math.max(0, Math.min(100, percent));
            const offset = CIRCUMFERENCE * (1 - percent / 100);
            circle.style.strokeDashoffset = offset;
        }

        if (window.geckoju) {
            window.geckoju.onData = function(data) {
                try {
                    const obj = JSON.parse(data);
                    if(obj.health !== undefined) setProgress('hpRing', obj.health);
                    if(obj.armor !== undefined) setProgress('armorRing', obj.armor);
                    if(obj.hunger !== undefined) setProgress('hungerRing', obj.hunger);
                    if(obj.thirst !== undefined) setProgress('thirstRing', obj.thirst);
                    if(obj.sleep !== undefined) setProgress('sleepRing', obj.sleep);
                } catch(e) {}
            };
        }
    </script>
</body>
</html>

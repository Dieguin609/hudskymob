<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            background: transparent !important; 
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            /* 2. TRAVA DE DEDO NA TELA AQUI */
            touch-action: none; 
            user-select: none;
        }

        .hud-top-right {
            position: absolute;
            top: 10px;
            right: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: -5px;
        }

        /* 1. DINHEIRO, BANCO E ID EM LINHA RETA */
        .top-row {
            display: flex;
            flex-direction: row; 
            gap: 6px; 
            justify-content: flex-end;
        }

        /* CAIXAS LISAS: AMARELO FORTE, SEM BORDA, TEXTO BRANCO */
        .hud-bar {
            background: #FFCC00; 
            border: none; /* ZERO BORDA */
            outline: none;
            padding: 3px 8px; 
            border-radius: 4px; 
            display: flex;
            align-items: center;
            gap: 5px; 
        }

        .hud-bar img { 
            width: 13px; 
            height: 13px; 
            filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.5)); /* Destaca o ícone */
        }

        /* TEXTO BRANCO COM SOMBRA PRA LER NO AMARELO */
        .val { 
            font-size: 11.5px; 
            font-weight: 900; 
            color: #FFFFFF; /* TEXTO BRANCO AQUI KRL */
            white-space: nowrap; 
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8); /* Sombra preta na letra pra não sumir no amarelo */
        }

        .label-id {
            font-size: 11px; 
            font-weight: 900;
            color: #FFFFFF; /* TEXTO BRANCO AQUI TAMBÉM */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* 2. BLOCO DA IMAGEM E HORÁRIO */
        .status-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 2px;
        }

        /* Deixei o relógio branco pra combinar com o resto! */
        .time { 
            font-size: 10px; 
            font-weight: 900; 
            color: #FFFFFF; 
            text-shadow: 1px 1px 3px black; 
            /* 2. MOVER O RELÓGIO (A MÁGICA É AQUI) */
            position: relative;
            
            top: -9px;   /* MOVER PARA BAIXO (se quiser mover pra CIMA, coloque negativo, ex: -5px) */
            right: -49px; /* MOVER PARA A ESQUERDA (afasta da imagem). Para ir pra direita, use left: 5px; */
        }

        .crystal-img { 
            width: 75px; 
            height: 75px; 
            object-fit: contain; 
        }

        /* 3. CRIPTOMOEDA DEBAIXO DA IMAGEM */
        .crypto-row {
            display: flex;
            justify-content: flex-end;
            margin-right: 2px;
            gap: -2px;
        }

        .bar-crypto {
            padding: 3px 10px;
        }


        /* =========================================
           SISTEMA DE NOTIFICAÇÃO (AJUSTADO)
           ========================================= */
        #notify-container {
            position: absolute;
            top: 35px; /* <-- Descemos um pouquinho (antes era 10px) */
            right: 15px; 
            z-index: 9999; 
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none; 
        }

        .notify-box {
            background: #111111; 
            color: white;
            padding: 8px 12px; /* <-- Diminuímos o tamanho da caixinha (antes era 12px 16px) */
            border-radius: 5px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 11.5px; /* <-- Fonte menor (antes era 13px) */
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px; /* <-- Diminuímos o espaço entre o emoji e o texto */
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            position: relative; 
            overflow: hidden; 
            animation: slideIn 0.3s ease-out, fadeOut 0.3s ease-in 4.7s forwards;
        }

        /* O "Cordãozinho" (Barrinha animada lá embaixo) */
        .notify-box::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            animation: shrinkBar 4.7s linear forwards; 
        }

        .notify-box.success::after { background: #00FF00; } 
        .notify-box.error::after { background: #FF3333; } 
        .notify-box.info::after { background: #FFCC00; } 

        .notify-icon { font-size: 14px; } /* <-- Emoji menor (antes era 16px) */

        @keyframes shrinkBar {
            from { width: 100%; }
            to { width: 0%; }
        }
        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(-15px); }
        }

    </style>
</head>
<body>

    <audio id="audio-success" src="acerto.mp3" preload="auto"></audio>
    <audio id="audio-error" src="erro.mp3" preload="auto"></audio>

    <div id="notify-container"></div>


    <div class="hud-top-right">
        
        <div class="top-row">
            <div class="hud-bar">
                <img src="cash_icon.png" alt="">
                <span class="val" id="cash">$1.200</span>
            </div>

            <div class="hud-bar">
                <img src="bank_icon.png" alt="">
                <span class="val" id="bank">40.000</span>
            </div>

            <div class="hud-bar">
                <span class="label-id">ID:</span>
                <span class="val" id="player_id">0</span>
            </div>
        </div>

        <div class="status-wrapper">
            <span class="time" id="time">12:33</span>
            <img src="cristal.png" class="crystal-img" alt="">
        </div>

        <div class="crypto-row">
            <div class="hud-bar bar-crypto">
                <img src="vip_icon.png" alt="">
                <span class="val" id="coins">0</span>
            </div>
        </div>

    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('time').innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        }
        setInterval(updateTime, 1000);
        updateTime();

        // ==========================================
        // FUNÇÃO DE CRIAR NOTIFICAÇÃO
        // ==========================================
        function showNotification(type, message) {
            const container = document.getElementById('notify-container');
            const notify = document.createElement('div');
            notify.className = `notify-box ${type}`;
            
            let icon = '💬';
            let somId = 'audio-success'; 

            if(type === 'error') { 
                icon = '⚠️'; 
                somId = 'audio-error'; 
            }
            if(type === 'success') { 
                icon = '✅'; 
            }

            notify.innerHTML = `<span class="notify-icon">${icon}</span> <span>${message}</span>`;
            container.appendChild(notify);
            
            const audio = document.getElementById(somId);
            if(audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("O navegador bloqueou o som", e));
            }

            setTimeout(() => {
                if(notify.parentElement) notify.remove();
            }, 5000);
        }

        // <-- MENSAGEM INICIAL ATUALIZADA AQUI -->
        window.onload = function() {
            setTimeout(() => {
                showNotification('success', 'Bem-vindo ao Eixo Central!');
            }, 1000);
        };


        // Integração com o Jogo
        if (window.geckoju) {
            window.geckoju.onData = function(data) {
                try {
                    const obj = JSON.parse(data);
                    if (obj.cash !== undefined) document.getElementById('cash').innerText = "$" + obj.cash.toLocaleString('pt-BR');
                    if (obj.bank !== undefined) document.getElementById('bank').innerText = obj.bank.toLocaleString('pt-BR');
                    if (obj.id !== undefined) document.getElementById('player_id').innerText = obj.id;
                    if (obj.coins !== undefined) document.getElementById('coins').innerText = obj.coins;
                } catch(e) {}
            };
        }
    </script>
</body>
</html>

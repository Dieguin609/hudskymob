<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* SEU CSS ORIGINAL - NÃO MEXI EM NADA VISUAL */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: transparent !important; overflow: hidden; width: 100%; height: 100%; pointer-events: none; }

        .radar-frame {
            position: relative;
            width: 135px; height: 135px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.9);
            background: #1a1a1a; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            margin: 5px 0 0 15px;
            overflow: hidden;
            perspective: 800px;
            z-index: 1;
            /* ADIÇÃO ESSENCIAL: Permite clicar para abrir o menu */
            pointer-events: auto; 
            cursor: pointer;
        }
        
        /* Efeito de clique */
        .radar-frame:active { transform: scale(0.95); border-color: #bf00ff; }

        #map-rotator {
            position: absolute; top: 50%; left: 50%;
            width: 0; height: 0; transform-style: preserve-3d;
        }

        #map-layer {
            position: absolute;
            width: 2500px; height: 2500px; 
            top: 0; left: 0;
            will-change: transform;
        }

        .map-img {
            width: 100%; height: 100%;
            background-image: url('map.png'); 
            background-size: 100% 100%; 
            background-repeat: no-repeat;
        }

        #arrow-rotator {
            position: absolute; top: 50%; left: 50%;
            width: 0; height: 0; z-index: 20;
        }

        .player-marker {
            position: absolute; top: 0; left: 0;
            width: 18px; height: 18px;
            background-image: url('seta.png');
            background-size: contain; background-repeat: no-repeat;
            background-position: center;
            transform: translate(-50%, -50%);
        }

        .glass-effect {
            position: absolute; inset: 0; border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
            z-index: 30; pointer-events: none;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <div class="radar-frame" onclick="abrirMenu()" ontouchend="abrirMenu()">
        <div id="map-rotator">
            <div id="map-layer">
                <div class="map-img"></div>
                
                <svg id="gps-svg" viewBox="0 0 2500 2500" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:visible;">
                    <polyline id="gps-line" points="" fill="none" stroke="#bf00ff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                </div>
        </div>
        <div id="arrow-rotator">
            <div class="player-marker"></div>
        </div>
        <div class="glass-effect"></div>
    </div>

    <script>
        const IMG_SIZE = 2500; 
        const MAP_SIZE = 6000; 
        const SCALE = IMG_SIZE / MAP_SIZE; // 0.416666
        const OFFSET = IMG_SIZE / 2; // 1250

        const mapLayer = document.getElementById('map-layer');
        const radarRotator = document.getElementById('radar-rotator');
        const gpsLine = document.getElementById('gps-line');

        // IMPORTANTE: Certifique-se que no seu HTML o SVG tem id="gps-svg" 
        // e a polyline tem id="gps-line"

        let targetPos = {x: 0, y: 0}, currentPos = {x: 0, y: 0};
        let targetCam = 0, currentCam = 0;
        let ultimaRota = "";

        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }
        
        function TentarConectar() {
            if (window.geckoju) {
                window.geckoju.onData = function(data) {
                    try {
                        const obj = JSON.parse(data);

                        // 1. ATUALIZA POSIÇÃO (Isso já funcionava, mantive igual)
                        let x = (obj.x !== undefined) ? obj.x : obj.pX;
                        let y = (obj.y !== undefined) ? obj.y : obj.pY;
                        
                        if (x !== undefined) {
                            // Conversão GTA -> Radar
                            let pixelX = x * SCALE;
                            let pixelY = -(y * SCALE); // Invertido
                            targetPos.x = -OFFSET - pixelX;
                            targetPos.y = -OFFSET - pixelY;

                            if (obj.ca !== undefined) targetCam = obj.ca;
                        }

                        // 2. RECEBE E DESENHA A ROTA (AQUI É A CORREÇÃO)
                        if (obj.string_rota && obj.string_rota !== ultimaRota) {
                             ultimaRota = obj.string_rota;
                             
                             const pontos = obj.string_rota.split('|');
                             let polyPoints = "";
                             
                             pontos.forEach(p => {
                                 const c = p.split(',');
                                 if(c.length >= 2) {
                                     // Matemática: 1250 + (Coord * 0.41666)
                                     let px = OFFSET + (parseFloat(c[0]) * SCALE);
                                     let py = OFFSET - (parseFloat(c[1]) * SCALE);
                                     polyPoints += `${px.toFixed(1)},${py.toFixed(1)} `;
                                 }
                             });
                             
                             if(gpsLine) gpsLine.setAttribute("points", polyPoints);
                        } 
                        else if (obj.gps_off) {
                            if(gpsLine) gpsLine.setAttribute("points", "");
                            ultimaRota = "";
                        }

                    } catch(e) {}
                };
            } else {
                setTimeout(TentarConectar, 500);
            }
        }

        function animate() {
            currentPos.x = lerp(currentPos.x, targetPos.x, 0.2);
            currentPos.y = lerp(currentPos.y, targetPos.y, 0.2);
            
            if(mapLayer) mapLayer.style.transform = `translate3d(${currentPos.x}px, ${currentPos.y}px, 0)`;
            if(radarRotator) radarRotator.style.transform = `rotateX(48deg) rotateZ(${targetCam}deg)`; // Simplifiquei a rotação

            requestAnimationFrame(animate);
        }

        TentarConectar();
        animate();
    </script>
</body>
</html>

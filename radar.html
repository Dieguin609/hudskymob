<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* ====================================================================
           SEU CSS ORIGINAL (NÃO MEXI EM NADA VISUAL)
           ==================================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: transparent !important; overflow: hidden; width: 100%; height: 100%; pointer-events: none; }

        .radar-frame {
            position: relative;
            width: 135px; height: 135px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.9);
            background: #1a1a1a; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            margin: 5px 0 0 15px;
            overflow: hidden;
            perspective: 800px;
            z-index: 1;
            pointer-events: auto; 
            cursor: pointer;
        }
        
        .radar-frame:active { transform: scale(0.95); }

        #radar-rotator {
            width: 100%; height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transform: rotateX(48deg); 
        }

        #map-layer {
            position: absolute;
            width: 3000px; height: 3000px; /* Tamanho da Imagem */
            background-image: url('map.png');
            background-size: 100% 100%;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            will-change: transform;
        }

        /* CONFIGURAÇÃO DA LINHA DO GPS */
        #gps-svg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            /* A linha precisa estar DENTRO do map-layer para mover junto com o mapa */
        }
        #gps-line {
            fill: none; 
            stroke: #bf00ff; /* Cor da sua linha */
            stroke-width: 15; 
            stroke-linecap: round; 
            stroke-linejoin: round;
        }

        .player-arrow-container {
            position: absolute; top: 50%; left: 50%;
            width: 0; height: 0; z-index: 10;
            transform-style: preserve-3d;
            transform: translateZ(10px) rotateX(-48deg);
        }
        #player-arrow {
            width: 20px; height: 20px;
            background-image: url('seta.png');
            background-size: contain; background-repeat: no-repeat;
            position: absolute; transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div class="radar-frame" onclick="abrirMenu()">
        <div id="radar-rotator">
            <div id="map-layer">
                <svg id="gps-svg" width="3000" height="3000">
                    <polyline id="gps-line" points="" />
                </svg>
            </div>
        </div>
        
        <div class="player-arrow-container">
            <div id="player-arrow"></div>
        </div>
    </div>

    <script>
        // === SUAS VARIÁVEIS E LÓGICA ORIGINAL ===
        
        const SMOOTH_SPEED = 0.15;
        const MAP_SIZE = 3000;  // Tamanho da imagem no CSS
        const GTA_SIZE = 6000;  // Tamanho real do mapa GTA
        const SCALE = MAP_SIZE / GTA_SIZE; // 0.5
        const OFFSET = MAP_SIZE / 2; // 1500

        // Posições
        let targetPos = { x: 0, y: 0 };
        let currentPos = { x: 0, y: 0 };
        let targetCamAngle = 0, currentCamAngle = 0;
        let targetPlayerAngle = 0, currentPlayerAngle = 0;

        // Elementos
        const mapLayer = document.getElementById('map-layer');
        const mapRotator = document.getElementById('radar-rotator');
        const arrowRotator = document.getElementById('player-arrow');
        const gpsLine = document.getElementById('gps-line');

        function abrirMenu() { if(window.geckoju) window.geckoju.send("menu"); }

        // === A ÚNICA FUNÇÃO QUE MEXI: CONVERSÃO DE COORDENADAS ===
        // Isso garante que a linha roxa fique em cima da rua certa
        function gtaToPixelGPS(x, y) {
            // Converte coordenada do jogo para pixel da imagem
            let px = (x * SCALE) + OFFSET;
            let py = (-y * SCALE) + OFFSET; // Y do GTA é invertido em relação ao HTML
            return { x: px, y: py };
        }
        
        // Conversão para mover o mapa (Oposto ao jogador)
        function gtaToPixelMap(x, y) {
            let px = (x * SCALE) + OFFSET;
            let py = (-y * SCALE) + OFFSET;
            return { x: -px, y: -py }; // Negativo para o mapa ir contra
        }

        // === COMUNICAÇÃO ===
        if (window.geckoju) {
            window.geckoju.onData = function(data) {
                try {
                    const obj = JSON.parse(data);

                    // 1. Atualiza Posição (Seu código original)
                    if (obj.pX !== undefined) {
                        const pos = gtaToPixelMap(obj.pX, obj.pY);
                        targetPos.x = pos.x;
                        targetPos.y = pos.y;
                        targetCamAngle = obj.camAngle || 0;
                        targetPlayerAngle = obj.pAngle || 0;
                    }

                    // 2. ATUALIZA A LINHA ROXA (AQUI ESTÁ O CONSERTO)
                    if (obj.string_rota && obj.string_rota.length > 5) {
                        const pontos = obj.string_rota.split('|');
                        let svgPoints = "";
                        
                        pontos.forEach(p => {
                            const c = p.split(',');
                            if(c.length === 2) {
                                // Usa a função corrigida para achar o pixel certo na imagem
                                const pt = gtaToPixelGPS(parseFloat(c[0]), parseFloat(c[1]));
                                svgPoints += `${pt.x},${pt.y} `;
                            }
                        });
                        gpsLine.setAttribute("points", svgPoints);
                    } 
                    else if (obj.gps_off) {
                        gpsLine.setAttribute("points", "");
                    }

                } catch(e) {}
            };
        } else {
            // Fallback para teste no PC
            setTimeout(() => { console.log("Geckoju não detectado (PC Mode)"); }, 1000);
        }

        // === SUA ANIMAÇÃO ORIGINAL (INTACTA) ===
        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }

        function shortestAngleDist(a0, a1) {
            var max = 360; var da = (a1 - a0) % max;
            return 2 * da % max - da;
        }

        function animate() {
            // Interpolação de Posição
            currentPos.x = lerp(currentPos.x, targetPos.x, SMOOTH_SPEED);
            currentPos.y = lerp(currentPos.y, targetPos.y, SMOOTH_SPEED);
            
            // Move o mapa
            mapLayer.style.transform = `translate3d(${currentPos.x}px, ${currentPos.y}px, 0)`;

            // Interpolação de Câmera (Gira o Mapa)
            let distCam = shortestAngleDist(currentCamAngle, targetCamAngle);
            if(Math.abs(distCam) < 120) currentCamAngle += distCam * SMOOTH_SPEED;
            else currentCamAngle = targetCamAngle;
            
            mapRotator.style.transform = `rotateX(48deg) rotateZ(${currentCamAngle}deg)`;

            // Interpolação do Player (Gira a Seta)
            let distPlayer = shortestAngleDist(currentPlayerAngle, targetPlayerAngle);
            if(Math.abs(distPlayer) < 120) currentPlayerAngle += distPlayer * SMOOTH_SPEED;
            else currentPlayerAngle = targetPlayerAngle;

            // Calcula rotação relativa da seta
            let arrowRotation = currentPlayerAngle - currentCamAngle;
            arrowRotator.style.transform = `translate(-50%, -50%) rotate(${-arrowRotation}deg)`; 

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            background: transparent !important; 
            overflow: hidden; 
            width: 100%;
            height: 100%;
        }

        /* Container Principal do Radar - AJUSTADO PARA 135PX */
        .radar-frame {
            position: relative;
            width: 135px; 
            height: 135px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8); 
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
            /* Mantendo colado no topo conforme seu pedido anterior */
            margin: 5px 0 0 15px; 
            overflow: hidden;
            perspective: 600px; 
        }

        /* O Mapa Inclinado (Efeito 3D) */
        .map-layer {
            position: absolute;
            width: 800%; 
            height: 800%;
            top: -350%;
            left: -350%;
            background-image: url('map.png'); 
            background-size: 400%; 
            background-repeat: no-repeat;
            transform: rotateX(48deg) rotateZ(0deg);
            transform-origin: center center;
            transition: transform 0.15s ease-out, background-position 0.2s ease-out;
        }

        /* Seta usando Imagem do Jogo */
        .player-marker {
            position: absolute;
            top: 48%; 
            left: 50%;
            width: 16px; /* Ajustado para a proporção de 135px */
            height: 16px;
            background-image: url('seta.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transform: translate(-50%, -50%);
            z-index: 10;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.9));
        }

        /* Overlay de Vidro */
        .glass-effect {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 11;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="radar-frame">
        <div class="map-layer" id="map"></div>
        <div class="player-marker"></div>
        <div class="glass-effect"></div>
    </div>

    <script>
        if (window.geckoju) {
            window.geckoju.onData = function(data) {
                try {
                    const obj = JSON.parse(data);
                    const map = document.getElementById('map');
                    if (obj.angle !== undefined) {
                        map.style.transform = `rotateX(48deg) rotateZ(${obj.angle}deg)`;
                    }
                    if (obj.posX !== undefined && obj.posY !== undefined) {
                        map.style.backgroundPosition = `${obj.posX}% ${obj.posY}%`;
                    }
                } catch(e) {}
            };
        }
    </script>
</body>
</html>

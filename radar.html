<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* ================= ESTILOS DO RADAR ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: transparent !important; overflow: hidden; width: 100%; height: 100%; pointer-events: none; }

        .radar-frame {
            position: relative;
            width: 135px; height: 135px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            background: #1a1a1a; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            margin: 5px 0 0 15px;
            overflow: hidden;
            /* Efeito 3D (Perspectiva) */
            perspective: 800px;
            z-index: 1;
            pointer-events: auto; /* Permite clicar para abrir o menu */
            cursor: pointer;
        }
        
        /* Círculo Interno que Gira e Inclina */
        #radar-rotator {
            width: 100%; height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            /* Inclinação inicial de 48 graus estilo GTA V */
            transform: rotateX(48deg); 
        }

        /* Camada do Mapa (Move-se oposto ao jogador) */
        #map-layer {
            position: absolute;
            width: 3000px; height: 3000px; /* Tamanho da Imagem */
            background-image: url('map.png'); /* A mesma imagem do mapa global */
            background-size: 100% 100%;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            will-change: transform;
        }

        /* SVG da Rota (GPS) */
        #gps-svg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        #gps-line {
            fill: none; stroke: #bf00ff; stroke-width: 18; /* Linha grossa */
            stroke-linecap: round; stroke-linejoin: round;
            filter: drop-shadow(0 0 2px #bf00ff);
        }

        /* Seta do Jogador (Fica parada no centro) */
        .player-arrow-container {
            position: absolute; top: 50%; left: 50%;
            width: 0; height: 0;
            z-index: 10;
            transform-style: preserve-3d;
             /* Compensa a inclinação do radar para a seta ficar "em pé" visualmente */
            transform: translateZ(10px) rotateX(-48deg);
        }
        #player-arrow {
            width: 20px; height: 20px;
            background-image: url('seta.png');
            background-size: contain; background-repeat: no-repeat;
            position: absolute; transform: translate(-50%, -50%);
        }

    </style>
</head>
<body>

    <div class="radar-frame" onclick="abrirMenu()">
        <div id="radar-rotator">
            <div id="map-layer">
                <svg id="gps-svg" width="3000" height="3000">
                    <polyline id="gps-line" points="" />
                </svg>
            </div>
        </div>
        
        <div class="player-arrow-container">
            <div id="player-arrow"></div>
        </div>
    </div>

    <script>
        // === CONFIGURAÇÕES ===
        const MAP_WIDTH_GTA = 6000;   // O mapa do GTA tem 6000 unidades de largura (-3000 a 3000)
        const MAP_IMG_SIZE = 3000;    // Tamanho da imagem map.png em pixels (ajuste se for diferente)
        const SCALE = MAP_IMG_SIZE / MAP_WIDTH_GTA; // Fator de conversão

        // Variáveis de Posição
        let targetX = 0, targetY = 0, targetAngle = 0, targetCamAngle = 0;
        let currX = 0, currY = 0, currAngle = 0, currCamAngle = 0;
        
        // Elementos
        const mapLayer = document.getElementById('map-layer');
        const radarRotator = document.getElementById('radar-rotator');
        const arrow = document.getElementById('player-arrow');
        const gpsLine = document.getElementById('gps-line');

        // Função para abrir o menu
        function abrirMenu() {
            if(window.geckoju) window.geckoju.send("menu");
        }

        // Função GTA -> Pixels (Centralizada no offset da imagem)
        function gtaToPixel(x, y) {
            // No GTA: X cresce pra direita, Y cresce pra cima (Norte)
            // No CSS: Left cresce pra direita, Top cresce pra baixo
            // Offset: 1500 (metade de 3000)
            
            let px = (x * SCALE) + (MAP_IMG_SIZE / 2);
            let py = (-y * SCALE) + (MAP_IMG_SIZE / 2); // Inverte Y
            return { x: px, y: py };
        }

        // === COMUNICAÇÃO COM SERVIDOR ===
        if (window.geckoju) {
            window.geckoju.onData = function(data) {
                try {
                    const obj = JSON.parse(data);

                    // 1. ATUALIZAR POSIÇÃO DO JOGADOR
                    if (obj.pX !== undefined) {
                        const pos = gtaToPixel(obj.pX, obj.pY);
                        
                        // O mapa move-se AO CONTRÁRIO do jogador para simular movimento
                        // Mas aqui guardamos a posição real do pixel para lerp
                        targetX = -pos.x; 
                        targetY = -pos.y;
                        
                        targetAngle = obj.pAngle || 0;
                        targetCamAngle = obj.camAngle || 0;
                    }

                    // 2. ATUALIZAR ROTA GPS
                    if (obj.string_rota) {
                        const pontos = obj.string_rota.split('|');
                        let svgPoints = "";
                        
                        pontos.forEach(p => {
                            const c = p.split(',');
                            if(c.length === 2) {
                                const pt = gtaToPixel(parseFloat(c[0]), parseFloat(c[1]));
                                svgPoints += `${pt.x},${pt.y} `;
                            }
                        });
                        gpsLine.setAttribute("points", svgPoints);
                        
                    } else if (obj.gps_off) {
                        gpsLine.setAttribute("points", "");
                    }

                } catch(e) {}
            };
        }

        // === ANIMAÇÃO SUAVE (LOOP) ===
        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }
        
        // Corrige o problema do giro 360->0 graus (evita girar tudo ao contrário)
        function lerpAngle(start, end, amt) {
            let diff = end - start;
            while (diff < -180) diff += 360;
            while (diff > 180) diff -= 360;
            return start + diff * amt;
        }

        function animate() {
            // Suavização (0.1 = lento, 0.2 = rápido)
            currX = lerp(currX, targetX, 0.15);
            currY = lerp(currY, targetY, 0.15);
            currCamAngle = lerpAngle(currCamAngle, targetCamAngle, 0.1);
            currAngle = lerpAngle(currAngle, targetAngle, 0.1);

            // Move o mapa
            // Importante: O centro do mapa (transform-origin) deve estar alinhado
            mapLayer.style.transform = `translate(${currX}px, ${currY}px)`;
            
            // Gira o radar baseado na Câmera (estilo GTA)
            // Mantém o X em 48deg para o efeito 3D
            radarRotator.style.transform = `rotateX(48deg) rotateZ(${currCamAngle}deg)`;

            // Gira a seta do jogador (Diferença entre para onde olho e para onde a câmera olha)
            let arrowRot = currAngle - currCamAngle;
            arrow.style.transform = `translate(-50%, -50%) rotate(${-arrowRot}deg)`;

            requestAnimationFrame(animate);
        }
        
        // Inicia
        requestAnimationFrame(animate);
    </script>
</body>
</html>

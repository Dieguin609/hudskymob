<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: transparent !important; overflow: hidden; width: 100%; height: 100%; pointer-events: none; }

        /* FRAME PRINCIPAL DO RADAR */
        .radar-frame {
            position: relative;
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.85);
            background: #1a1a1a; 
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.9);
            margin: 10px 0 0 20px;
            overflow: hidden;
            z-index: 10;
            
            /* LIBERA O CLIQUE */
            pointer-events: auto; 
            cursor: pointer;
            transition: transform 0.1s ease, border-color 0.2s ease;
        }
        
        /* EFEITO DE CLICAR (PISCA ROXO E AFUNDA) */
        .radar-frame:active { 
            transform: scale(0.92); 
            border-color: #bf00ff; 
        }

        #radar-rotator {
            width: 100%; height: 100%;
            position: absolute;
            transform-origin: 50% 50%;
            will-change: transform;
        }

        #map-layer {
            position: absolute;
            width: 2500px; height: 2500px; 
            background-image: url('map.png'); /* SEU MAPA AQUI */
            background-size: 100% 100%;
            left: 50%; top: 50%;
            transform: translate(-1250px, -1250px);
            will-change: transform;
        }

        /* CAMADA DA LINHA DO GPS */
        #gps-svg {
            position: absolute; top: 0; left: 0;
            width: 2500px; height: 2500px;
            z-index: 99; 
            pointer-events: none; /* Não bloqueia clique */
            overflow: visible;
        }

        #arrow-rotator {
            position: absolute; top: 50%; left: 50%;
            width: 0; height: 0; z-index: 101; 
            will-change: transform;
        }

        .player-marker {
            position: absolute; top: 0; left: 0;
            width: 22px; height: 22px;
            background-image: url('seta.png'); /* SUA SETA AQUI */
            background-size: contain; background-repeat: no-repeat;
            background-position: center;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.8));
        }

        /* VIDRO DO RADAR (BRILHO) */
        .glass-effect {
            position: absolute; inset: 0; border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
            z-index: 100; /* Fica acima do mapa, mas abaixo da seta */
            pointer-events: none; /* ISSO IMPEDE O VIDRO DE BLOQUEAR SEU CLIQUE */
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    
    <div class="radar-frame" onclick="abrirMapa()">
        
        <div id="radar-rotator">
            <div id="map-layer">
                <svg id="gps-svg" viewBox="0 0 2500 2500">
                    <polyline id="gps-line" points="" fill="none" stroke="#bf00ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px #bf00ff); vector-effect: non-scaling-stroke;"/>
                </svg>
            </div>
        </div>
        
        <div class="glass-effect"></div>
        
        <div id="arrow-rotator">
            <div class="player-marker"></div>
        </div>
        
    </div>

    <script>
        // --- CONSTANTES DE ESCALA DO MAPA DO GTA SA ---
        const SCALE = 2500 / 6000;
        const OFFSET = 1250;
        
        const mapLayer = document.getElementById('map-layer'); 
        const gpsLine = document.getElementById('gps-line');   
        const radarRotator = document.getElementById('radar-rotator');
        const arrowRotator = document.getElementById('arrow-rotator');

        let curX = 0, curY = 0, targetX = 0, targetY = 0;
        let curCamAng = 0, targetCamAng = 0; // Ângulos da Câmera (Tela)
        let playerAng = 0; // Ângulo do Corpo do Boneco

        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }
        function angleDiff(a, b) { let d = b - a; while (d < -180) d += 360; while (d > 180) d -= 360; return d; }

        // --- FUNÇÃO DO CLIQUE DO RADAR ---
        function abrirMapa() {
            // Manda a string "abrir_mapa" pro seu OnGeckojuEvent no Pawn
            if(window.geckoju) window.geckoju.send("abrir_mapa");
        }

        function Conectar() {
            if(!window.geckoju) { setTimeout(Conectar, 100); return; }

            window.geckoju.onData = function(data) {
                try {
                    const obj = JSON.parse(data);

                    // 1. ATUALIZA POSIÇÃO E ÂNGULOS
                    if (obj.x !== undefined) {
                        // Calcula posição X e Y
                        let px = -(OFFSET + (obj.x * SCALE)); 
                        let py = -(OFFSET - (obj.y * SCALE));

                        // 70 é a metade do radar (140px / 2) para centralizar cravado
                        targetX = px + 70; 
                        targetY = py + 70;
                        
                        // LÓGICA ESTILO GTA SA:
                        // Tenta pegar o ângulo da câmera se o plugin mandar (cAngle, cam_a)
                        // Se não tiver, usa o 'a' como câmera.
                        if(obj.cAngle !== undefined) targetCamAng = obj.cAngle;
                        else if(obj.cam_a !== undefined) targetCamAng = obj.cam_a;
                        else if(obj.a !== undefined) targetCamAng = obj.a;

                        // Pega o ângulo do boneco (pAngle)
                        if(obj.pAngle !== undefined) playerAng = obj.pAngle;
                        else if(obj.a !== undefined) playerAng = obj.a;
                    }

                    // 2. SISTEMA DA ROTA ROXA (GPS FATIADO)
                    if(obj.gps_start) gpsLine.setAttribute('points', "");

                    if(obj.rn && Array.isArray(obj.rn)) {
                        let currentSvg = gpsLine.getAttribute('points') || "";
                        for(let i = 0; i < obj.rn.length; i += 2) {
                            if(obj.rn[i] === undefined || obj.rn[i+1] === undefined) break; // Segurança anti-crash
                            
                            let rpx = OFFSET + (obj.rn[i] * SCALE);
                            let rpy = OFFSET - (obj.rn[i+1] * SCALE);
                            
                            currentSvg += `${rpx.toFixed(1)},${rpy.toFixed(1)} `;
                        }
                        gpsLine.setAttribute('points', currentSvg);
                    }

                    if(obj.gps_off) gpsLine.setAttribute('points', "");

                } catch(e) {}
            };
        }

        function Render() {
            // Suaviza o movimento do mapa
            curX = lerp(curX, targetX, 0.2);
            curY = lerp(curY, targetY, 0.2);
            mapLayer.style.transform = `translate3d(${curX}px, ${curY}px, 0)`;

            // --- A MÁGICA DA ROTAÇÃO (ESTILO GTA SA) ---
            
            // 1. O MAPA RODA JUNTO COM A TELA/CÂMERA
            let diff = angleDiff(curCamAng, targetCamAng);
            curCamAng += diff * 0.15;
            radarRotator.style.transform = `rotateZ(${curCamAng}deg)`;
            
            // 2. A SETA APONTA PARA ONDE O PEITO DO BONECO TÁ VIRADO (Relativo à tela)
            let arrowMath = curCamAng - playerAng;
            arrowRotator.style.transform = `translate(-50%, -50%) rotate(${arrowMath}deg)`;

            requestAnimationFrame(Render);
        }

        Conectar();
        Render();
    </script>
</body>
</html>

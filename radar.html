<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* SEU CSS ORIGINAL - NÃO MEXI EM NADA VISUAL */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: transparent !important; overflow: hidden; width: 100%; height: 100%; pointer-events: none; }

        .radar-frame {
            position: relative;
            width: 135px; height: 135px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.9);
            background: #1a1a1a; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            margin: 5px 0 0 15px;
            overflow: hidden;
            perspective: 800px;
            z-index: 1;
            /* ADIÇÃO ESSENCIAL: Permite clicar para abrir o menu */
            pointer-events: auto; 
            cursor: pointer;
        }
        
        /* Efeito de clique */
        .radar-frame:active { transform: scale(0.95); border-color: #bf00ff; }

        #map-rotator {
            position: absolute; top: 50%; left: 50%;
            width: 0; height: 0; transform-style: preserve-3d;
        }

        #map-layer {
            position: absolute;
            width: 2500px; height: 2500px; 
            top: 0; left: 0;
            will-change: transform;
        }

        .map-img {
            width: 100%; height: 100%;
            background-image: url('map.png'); 
            background-size: 100% 100%; 
            background-repeat: no-repeat;
        }

        #arrow-rotator {
            position: absolute; top: 50%; left: 50%;
            width: 0; height: 0; z-index: 20;
        }

        .player-marker {
            position: absolute; top: 0; left: 0;
            width: 18px; height: 18px;
            background-image: url('seta.png');
            background-size: contain; background-repeat: no-repeat;
            background-position: center;
            transform: translate(-50%, -50%);
        }

        .glass-effect {
            position: absolute; inset: 0; border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
            z-index: 30; pointer-events: none;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <div class="radar-frame" onclick="abrirMenu()" ontouchend="abrirMenu()">
        <div id="map-rotator">
            <div id="map-layer">
                <div class="map-img"></div>
                
                <svg id="gps-svg" viewBox="0 0 2500 2500" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;">
                    <polyline id="gps-line" points="" fill="none" stroke="#bf00ff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                </div>
        </div>
        <div id="arrow-rotator">
            <div class="player-marker"></div>
        </div>
        <div class="glass-effect"></div>
    </div>

    <script>
        const IMG_SIZE = 2500; 
        const MAP_SIZE = 6000; 
        const SCALE = IMG_SIZE / MAP_SIZE;
        const MAP_CENTER_OFFSET = IMG_SIZE / 2;

        const SMOOTH_SPEED = 0.3; 

        const mapRotator = document.getElementById('map-rotator');
        const mapLayer = document.getElementById('map-layer');
        const arrowRotator = document.getElementById('arrow-rotator');
        const gpsLine = document.getElementById('gps-line');

        let currentPos = { x: 0, y: 0 };
        let targetPos = { x: 0, y: 0 };
        let currentCamAngle = 0, targetCamAngle = 0;
        let currentPlayerAngle = 0, targetPlayerAngle = 0;

        function shortestAngleDist(a0, a1) {
            var max = 360; var da = (a1 - a0) % max; return 2 * da % max - da;
        }

        function lerp(start, end, amt) {
            return (1 - amt) * start + amt * end;
        }

        // --- FUNÇÃO PARA ABRIR O MENU (ESSENCIAL) ---
        function abrirMenu() {
            if (window.geckoju) {
                window.geckoju.send("menu");
            }
        }

        // Variável para evitar redesenhar a mesma rota mil vezes
        let ultimaRotaRecebida = ""; 

        function TentarConectar() {
            if (window.geckoju) {
                window.geckoju.onData = function(data) {
                    try {
                        const obj = JSON.parse(data);

                        // --- 1. ATUALIZAÇÃO LEVE (POSIÇÃO) ---
                        // Isso roda 20x por segundo sem travar
                        let serverX = (obj.x !== undefined) ? obj.x : obj.pX;
                        let serverY = (obj.y !== undefined) ? obj.y : obj.pY;
                        let serverCam = (obj.ca !== undefined) ? obj.ca : obj.camAngle;
                        let serverPly = (obj.a !== undefined) ? obj.a : obj.pAngle;

                        if (serverX !== undefined) {
                            let offsetX = (serverX * SCALE);
                            let offsetY = -(serverY * SCALE); 
                            targetPos.x = -1250 - offsetX; // 1250 é o centro (MAP_SIZE/2)
                            targetPos.y = -1250 - offsetY;

                            if (serverCam !== undefined) targetCamAngle = serverCam;
                            if (serverPly !== undefined) targetPlayerAngle = serverPly;
                        }

                        // ATUALIZAÇÃO DA ROTA (SÓ QUANDO MUDAR)
                        if (obj.string_rota && obj.string_rota.length > 5) {
                            
                            // TRAVA DE SEGURANÇA: Só desenha se a rota for NOVA.
                            if (obj.string_rota !== ultimaRotaRecebida) {
                                ultimaRotaRecebida = obj.string_rota; // Atualiza a trava
                                
                                const pontos = obj.string_rota.split('|');
                                let polyPoints = "";
                                
                                // Dentro do window.geckoju.onData na parte da rota:
                                pontos.forEach(p => {
                                    const c = p.split(',');
                                    if(c.length >= 2) {
                                        // IMG_SIZE = 2500 | MAP_SIZE = 6000
                                        // A conta tem que ser idêntica à do movimento do mapa
                                        let rawX = parseFloat(c[0]);
                                        let rawY = parseFloat(c[1]);

                                        let px = 1250 + (rawX * (2500 / 6000)); 
                                        let py = 1250 - (rawY * (2500 / 6000)); // O Y do GTA é invertido!
                                        
                                        polyPoints += `${px},${py} `;
                                    }
                                });
                                
                                if(gpsLine) gpsLine.setAttribute("points", polyPoints);
                            }
                        } 
                        else if (obj.gps_off) {
                            if(gpsLine) gpsLine.setAttribute("points", "");
                            ultimaRotaRecebida = ""; // Destrava
                        }

                    } catch(e) {}
                };
            } else {
                setTimeout(TentarConectar, 500);
            }
        }

        function animate() {
            currentPos.x = lerp(currentPos.x, targetPos.x, SMOOTH_SPEED);
            currentPos.y = lerp(currentPos.y, targetPos.y, SMOOTH_SPEED);
            
            mapLayer.style.transform = `translate3d(${currentPos.x}px, ${currentPos.y}px, 0)`;

            let distCam = shortestAngleDist(currentCamAngle, targetCamAngle);
            if(Math.abs(distCam) < 120) currentCamAngle += distCam * SMOOTH_SPEED;
            else currentCamAngle = targetCamAngle;
            
            mapRotator.style.transform = `rotateX(48deg) rotateZ(${currentCamAngle}deg)`;

            let distPlayer = shortestAngleDist(currentPlayerAngle, targetPlayerAngle);
            if(Math.abs(distPlayer) < 120) currentPlayerAngle += distPlayer * SMOOTH_SPEED;
            else currentPlayerAngle = targetPlayerAngle;

            let arrowRotation = currentPlayerAngle - currentCamAngle;
            arrowRotator.style.transform = `rotateZ(${-arrowRotation}deg)`; 

            requestAnimationFrame(animate);
        }

        TentarConectar();
        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: transparent !important; overflow: hidden; width: 100%; height: 100%; pointer-events: none; }

        .radar-frame {
            position: relative;
            width: 135px; height: 135px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.9);
            background: #1a1a1a; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            margin: 5px 0 0 15px;
            overflow: hidden;
            perspective: 800px;
            z-index: 10;
        }

        #radar-rotator {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
            transform-origin: 50% 50%;
            will-change: transform;
        }

        #map-layer {
            width: 2500px; height: 2500px;
            position: absolute;
            background-image: url('map.png');
            background-size: 100% 100%;
            transform-origin: 0 0;
            will-change: transform;
        }

        #gps-svg {
            position: absolute; top: 0; left: 0;
            width: 2500px; height: 2500px;
            pointer-events: none;
            overflow: visible;
        }

        #arrow-rotator {
            position: absolute;
            top: 50%; left: 50%;
            width: 20px; height: 20px;
            background-image: url('seta.png');
            background-size: contain; background-repeat: no-repeat;
            z-index: 20;
            will-change: transform;
        }
    </style>
</head>
<body>

    <div class="radar-frame">
        <div id="radar-rotator">
            <div id="map-layer">
                <svg id="gps-svg" viewBox="0 0 2500 2500">
                    <polyline id="gps-line" points="" fill="none" stroke="#bf00ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px #bf00ff);"/>
                </svg>
            </div>
        </div>
        <div id="arrow-rotator"></div>
    </div>

    <script>
        const SCALE = 2500 / 6000;
        const OFFSET = 1250;
        
        const mapLayer = document.getElementById('map-layer');
        const gpsLine = document.getElementById('gps-line');
        const radarRotator = document.getElementById('radar-rotator');
        const arrowRotator = document.getElementById('arrow-rotator');

        let curX = 0, curY = 0, targetX = 0, targetY = 0;
        let curAng = 0, targetAng = 0, playerAng = 0;

        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }
        function angleDiff(a, b) { let d = b - a; while (d < -180) d += 360; while (d > 180) d -= 360; return d; }

        function Conectar() {
            if(!window.geckoju) { setTimeout(Conectar, 100); return; }

            window.geckoju.onData = function(data) {
                try {
                    const obj = JSON.parse(data);

                    if (obj.x !== undefined) {
                        let px = -(OFFSET + (obj.x * SCALE)); 
                        let py = -(OFFSET - (obj.y * SCALE));

                        targetX = px + 67.5; // Centraliza no radar de 135px
                        targetY = py + 67.5;
                        
                        if(obj.a !== undefined) targetAng = obj.a;
                        if(obj.pAngle !== undefined) playerAng = obj.pAngle;
                    }

                    if(obj.gps_start) gpsLine.setAttribute('points', "");

                    if(obj.rn && Array.isArray(obj.rn)) {
                        let currentSvg = gpsLine.getAttribute('points') || "";
                        for(let i = 0; i < obj.rn.length; i += 2) {
                            if(obj.rn[i] === undefined || obj.rn[i+1] === undefined) break; // Segurança
                            let rpx = OFFSET + (obj.rn[i] * SCALE);
                            let rpy = OFFSET - (obj.rn[i+1] * SCALE);
                            currentSvg += `${rpx.toFixed(1)},${rpy.toFixed(1)} `;
                        }
                        gpsLine.setAttribute('points', currentSvg);
                    }

                    if(obj.gps_off) gpsLine.setAttribute('points', "");

                } catch(e) {}
            };
        }

        function Render() {
            curX = lerp(curX, targetX, 0.2);
            curY = lerp(curY, targetY, 0.2);
            mapLayer.style.transform = `translate3d(${curX}px, ${curY}px, 0)`;

            let diff = angleDiff(curAng, targetAng);
            curAng += diff * 0.15;
            radarRotator.style.transform = `rotateZ(${curAng}deg)`;
            
            let arrowDiff = playerAng - curAng;
            arrowRotator.style.transform = `translate(-50%, -50%) rotate(${-arrowDiff}deg)`;

            requestAnimationFrame(Render);
        }

        Conectar();
        Render();
    </script>
</body>
</html>

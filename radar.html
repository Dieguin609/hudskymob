<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: transparent !important; overflow: hidden; width: 100%; height: 100%; }

        .radar-frame {
            position: relative;
            width: 135px; height: 135px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.9);
            background: #1a1a1a; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            margin: 5px 0 0 15px;
            overflow: hidden;
            /* Perspectiva para o efeito 3D */
            perspective: 800px; 
            z-index: 1;
        }

        /* DIV PIVÔ (Fica parada no centro e Gira) */
        #rotator {
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            transform-style: preserve-3d;
        }

        /* O MAPA (Se move dentro do Pivô) */
        #map-layer {
            position: absolute;
            width: 2500px; height: 2500px;
            /* Importante: Top/Left 0 para a matemática funcionar */
            top: 0; left: 0;
            will-change: transform;
        }

        .map-img {
            width: 100%; height: 100%;
            background-image: url('map.png'); 
            background-size: 100% 100%; 
            background-repeat: no-repeat;
        }

        /* Seta (Fica parada no centro da tela) */
        .player-marker {
            position: absolute; top: 50%; left: 50%;
            width: 18px; height: 18px;
            background-image: url('seta.png');
            background-size: contain; background-repeat: no-repeat;
            background-position: center;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .glass-effect {
            position: absolute; inset: 0; border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
            z-index: 11; pointer-events: none;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <div class="radar-frame">
        <div id="rotator">
            <div id="map-layer">
                <div class="map-img"></div>
                <svg width="2500" height="2500" style="position:absolute; top:0; left:0;">
                     <polyline id="gps-line" points="" fill="none" stroke="#bf00ff" stroke-width="15" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
        <div class="player-marker"></div>
        <div class="glass-effect"></div>
    </div>

    <script>
        // CONFIGURAÇÕES
        const IMG_SIZE = 1500;
        const MAP_SIZE = 6000; 
        const SCALE = IMG_SIZE / MAP_SIZE; // 0.41666...
        
        const rotator = document.getElementById('rotator');
        const mapLayer = document.getElementById('map-layer');
        const gpsLine = document.getElementById('gps-line');

        // Posição central da imagem do mapa (1250px)
        const MAP_CENTER_OFFSET = IMG_SIZE / 2;

        function TentarConectar() {
            if (window.geckoju) {
                window.geckoju.onData = function(data) {
                    try {
                        const obj = JSON.parse(data);

                        if (obj.pX !== undefined) {
                            // 1. Onde o player está no mundo do jogo?
                            // X cresce p/ direita, Y cresce p/ cima (Norte) no GTA
                            // No CSS, Y cresce p/ baixo. Por isso o Y é negativo.
                            
                            // Deslocamento em pixels a partir do centro do mapa
                            let offsetX = obj.pX * SCALE;
                            let offsetY = -(obj.pY * SCALE); // Inverte Y do GTA

                            // 2. Cálculo Final da Posição
                            // A imagem tem que mover para ESQUERDA (-) se o player for pra DIREITA (+)
                            // E tem que começar deslocada pelo centro da imagem (-1250)
                            let finalX = -MAP_CENTER_OFFSET - offsetX;
                            let finalY = -MAP_CENTER_OFFSET - offsetY;

                            // 3. Aplica o movimento
                            mapLayer.style.transform = `translate3d(${finalX}px, ${finalY}px, 0)`;

                            // 4. Aplica a rotação (Inversa ao player)
                            if (obj.pAngle !== undefined) {
                                // 48deg é a inclinação da câmera
                                rotator.style.transform = `rotateX(48deg) rotateZ(${obj.pAngle}deg)`;
                            }
                        }

                        // Atualiza GPS
                        if (obj.string_rota && obj.string_rota.length > 5) {
                             const pontos = obj.string_rota.split('|');
                             let polyPoints = "";
                             pontos.forEach(p => {
                                 const c = p.split(',');
                                 if(c.length >= 2) {
                                     let px = MAP_CENTER_OFFSET + (parseFloat(c[0]) * SCALE);
                                     let py = MAP_CENTER_OFFSET - (parseFloat(c[1]) * SCALE);
                                     polyPoints += `${px},${py} `;
                                 }
                             });
                             gpsLine.setAttribute("points", polyPoints);
                        } else if (obj.gps_off) {
                            gpsLine.setAttribute("points", "");
                        }

                    } catch(e) {}
                };
            } else {
                setTimeout(TentarConectar, 500);
            }
        }
        TentarConectar();
    </script>
</body>

</html>

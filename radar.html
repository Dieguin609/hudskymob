<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: transparent !important; overflow: hidden; width: 100%; height: 100%; pointer-events: none; }

        .radar-frame {
            position: relative;
            width: 135px; height: 135px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.9);
            background: #1a1a1a; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            margin: 5px 0 0 15px;
            overflow: hidden;
            perspective: 800px;
            z-index: 10;
            pointer-events: auto; 
            cursor: pointer;
        }
        
        .radar-frame:active { transform: scale(0.95); border-color: #bf00ff; }

        #radar-rotator {
            width: 100%; height: 100%;
            position: absolute;
            transform-origin: 50% 50%;
        }

        #map-layer {
            position: absolute;
            width: 2500px; height: 2500px; 
            background-image: url('map.png'); /* TEM QUE TER O map.png */
            background-size: 100% 100%;
            left: 50%; top: 50%;
            /* Inicia centralizado */
            transform: translate(-1250px, -1250px);
            will-change: transform;
        }

        /* CORREÇÃO 1: SVG COM Z-INDEX ALTO */
        #gps-svg {
            position: absolute; top: 0; left: 0;
            width: 2500px; height: 2500px;
            z-index: 99; /* Acima do mapa */
            pointer-events: none;
            overflow: visible;
        }

        #gps-line {
            vector-effect: non-scaling-stroke;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.8));
        }

        #arrow-rotator {
            position: absolute; top: 50%; left: 50%;
            width: 0; height: 0; z-index: 101; /* Acima de tudo */
        }

        .player-marker {
            position: absolute; top: 0; left: 0;
            width: 18px; height: 18px;
            background-image: url('seta.png');
            background-size: contain; background-repeat: no-repeat;
            background-position: center;
            transform: translate(-50%, -50%);
        }

        /* CORREÇÃO 2: VIDRO COM Z-INDEX MENOR */
        .glass-effect {
            position: absolute; inset: 0; border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
            z-index: 50; /* Abaixo da seta, mas acima do mapa */
            pointer-events: none;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <div class="radar-frame">
        <div id="radar-rotator">
            <div id="map-layer">
                
                <svg id="gps-svg" viewBox="0 0 2500 2500">
                    <polyline id="gps-line" points="" fill="none" stroke="#bf00ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>

            </div>
        </div>
        
        <div class="glass-effect"></div>
        
        <div id="arrow-rotator">
            <div class="player-marker"></div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES IGUAIS AO PC (Script.js)
        const IMG_SIZE = 2500; 
        const MAP_SIZE = 6000; 
        const SCALE = IMG_SIZE / MAP_SIZE; // 0.416666
        const OFFSET = 1250;               // Centro da Imagem

        const mapLayer = document.getElementById('map-layer');
        const radarRotator = document.getElementById('radar-rotator');
        const arrowRotator = document.getElementById('arrow-rotator');
        const gpsLine = document.getElementById('gps-line');
        const radarFrame = document.querySelector('.radar-frame');

        let targetX = 0, targetY = 0, curX = 0, curY = 0;
        let targetAng = 0, curAng = 0;
        let playerAng = 0;

        // Clique para abrir mapa
        function abrirMenu() { if (window.geckoju) window.geckoju.send("abrir_mapa_global"); }
        if(radarFrame) {
            radarFrame.addEventListener('click', abrirMenu);
            radarFrame.addEventListener('touchend', function(e){ e.preventDefault(); abrirMenu(); });
        }

        function lerp(start, end, amt) { return (1-amt)*start+amt*end; }
        function angleDiff(a, b) { let d = (b-a)%360; return d < -180 ? d+360 : (d > 180 ? d-360 : d); }

        function Conectar() {
            if(!window.geckoju) { setTimeout(Conectar, 200); return; }

            window.geckoju.onData = function(data) {
                try {
                    let obj = JSON.parse(data);

                    // 1. POSIÇÃO (X, Y) MANTIDA EXATAMENTE COMO VOCÊ FEZ
                    if(obj.x !== undefined) {
                        // CORREÇÃO MATEMÁTICA (Igual PC)
                        // O mapa move ao contrário do jogador
                        targetX = -OFFSET - (obj.x * SCALE);
                        targetY = -OFFSET + (obj.y * SCALE); // Y invertido no GTA

                        if(obj.a !== undefined) playerAng = obj.a;
                        
                        // Se vier camera, usa. Se não, usa player.
                        if(obj.ca !== undefined) targetAng = obj.ca;
                        else targetAng = playerAng;
                    }

                    // ==========================================
                    // 2. NOVA LÓGICA DO GPS FATIADO APLICADA AQUI
                    // ==========================================
                    
                    // Limpar Rota quando iniciar nova
                    if(obj.gps_start) {
                        gpsLine.setAttribute('points', "");
                    }

                    // Receber pacotes de rota
                    if(obj.rn && Array.isArray(obj.rn)) {
                        let currentSvg = gpsLine.getAttribute('points') || "";
                        
                        for(let i = 0; i < obj.rn.length; i += 2) {
                            if(obj.rn[i] === undefined || obj.rn[i+1] === undefined) break; 
                            
                            let gx = obj.rn[i];
                            let gy = obj.rn[i+1];
                            
                            // A MESMA MATEMÁTICA DO PC PARA A LINHA:
                            let px = OFFSET + (gx * SCALE);
                            let py = OFFSET - (gy * SCALE);
                            
                            currentSvg += `${px.toFixed(1)},${py.toFixed(1)} `;
                        }
                        gpsLine.setAttribute("points", currentSvg);
                    } 
                    
                    // Desligar o GPS
                    if(obj.gps_off) {
                        gpsLine.setAttribute("points", "");
                    }
                    // ==========================================

                } catch(e) {}
            };
        }

        function Render() {
            // Suavização
            curX = lerp(curX, targetX, 0.2);
            curY = lerp(curY, targetY, 0.2);
            mapLayer.style.transform = `translate3d(${curX}px, ${curY}px, 0)`;

            // Rotação do Mapa
            let diff = angleDiff(curAng, targetAng);
            curAng += diff * 0.15;
            radarRotator.style.transform = `rotateZ(${curAng}deg)`;
            
            // Rotação da Seta (Compensação)
            let arrowDiff = playerAng - curAng;
            arrowRotator.style.transform = `translate(-50%, -50%) rotate(${-arrowDiff}deg)`;

            requestAnimationFrame(Render);
        }

        Conectar();
        Render();
    </script>
</body>
</html>

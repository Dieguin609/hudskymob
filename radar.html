<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: transparent !important; overflow: hidden; width: 100%; height: 100%; }

        /* Container do Radar */
        .radar-frame {
            position: relative;
            width: 135px; height: 135px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.9);
            background: #000; /* Fundo preto padrão */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            margin: 5px 0 0 15px;
            overflow: hidden;
            perspective: 600px;
            z-index: 1;
        }

        /* Container que gira e move */
        #map-container {
            position: absolute;
            width: 2500px; /* Tamanho da imagem */
            height: 2500px;
            transform-origin: center center;
            will-change: transform, left, top;
            left: -1250px; /* Centraliza inicialmente */
            top: -1250px;
        }

        /* A IMAGEM DO MAPA */
        .map-img {
            position: absolute;
            width: 100%;
            height: 100%;
            /* COR DE FUNDO AZUL (OCEANO) PARA TESTE */
            /* Se a imagem falhar, vai ficar AZUL em vez de PRETO */
            background-color: #1a4c6d; 
            
            /* Tenta carregar a imagem */
            background-image: url('map.png'); 
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        /* Linha do GPS */
        #gps-svg-mini {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* Seta do Jogador */
        .player-marker {
            position: absolute;
            top: 50%; left: 50%;
            width: 18px; height: 18px;
            /* Se a seta falhar, mostra um quadrado vermelho */
            background-color: transparent; 
            background-image: url('seta.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* Brilho do vidro */
        .glass-effect {
            position: absolute; inset: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
            z-index: 11;
            pointer-events: none;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
        }
        
        /* Texto de Aviso (Debugging) */
        #debug-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: lime;
            font-family: Arial, sans-serif;
            font-size: 10px;
            font-weight: bold;
            z-index: 20;
            text-align: center;
            display: block; /* Começa visível */
        }
    </style>
</head>
<body>
    <div class="radar-frame">
        <div id="map-container">
            <div class="map-img"></div>
            <svg id="gps-svg-mini">
                <polyline id="gps-line" points="" fill="none" stroke="#bf00ff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />
            </svg>
        </div>
        <div class="player-marker"></div>
        <div class="glass-effect"></div>
        <div id="debug-text">Aguardando...</div>
    </div>

    <script>
        // CONFIGURAÇÕES IGUAIS AO SEU PC
        const IMG_SIZE = 2500;
        const MAP_SIZE = 6000; 
        const SCALE = IMG_SIZE / MAP_SIZE; // 0.4166
        const RADAR_SIZE = 135;
        const CENTER_OFFSET = RADAR_SIZE / 2;

        const mapContainer = document.getElementById('map-container');
        const gpsLine = document.getElementById('gps-line');
        const debugText = document.getElementById('debug-text');
        
        // Esconde o texto de debug se receber dados
        let dataReceived = false;

        if (window.geckoju) {
            window.geckoju.onData = function(data) {
                try {
                    const obj = JSON.parse(data);

                    if (!dataReceived) {
                        dataReceived = true;
                        debugText.style.display = 'none'; // Sumir texto
                    }

                    // 1. Atualiza Mapa
                    if (obj.pX !== undefined && obj.pY !== undefined) {
                        // Converte Posição GTA para Pixels
                        // X no GTA cresce para direita (+), Y cresce para norte (+)
                        // Na imagem, X é direita (+), Y é para baixo (-)
                        
                        // Fórmula ajustada para bater com o centro da imagem
                        let x = (IMG_SIZE / 2) + (obj.pX * SCALE);
                        let y = (IMG_SIZE / 2) - (obj.pY * SCALE);

                        // Aplica o movimento
                        mapContainer.style.left = `${-(x - CENTER_OFFSET)}px`;
                        mapContainer.style.top = `${-(y - CENTER_OFFSET)}px`;
                        
                        // Aplica rotação (Inverte o angulo se necessário)
                        if (obj.pAngle !== undefined) {
                            mapContainer.style.transform = `rotateX(48deg) rotateZ(${obj.pAngle}deg)`;
                        }
                    }

                    // 2. Atualiza GPS
                    if (obj.string_rota && obj.string_rota.length > 5) {
                        const pontos = obj.string_rota.split('|');
                        let polyPoints = "";
                        pontos.forEach(p => {
                            const c = p.split(',');
                            if(c.length >= 2) {
                                let px = (IMG_SIZE / 2) + (parseFloat(c[0]) * SCALE);
                                let py = (IMG_SIZE / 2) - (parseFloat(c[1]) * SCALE);
                                polyPoints += `${px},${py} `;
                            }
                        });
                        gpsLine.setAttribute("points", polyPoints);
                    } else if (obj.gps_off) {
                        gpsLine.setAttribute("points", "");
                    }

                } catch(e) {
                    // Se der erro no JSON, avisa no debug
                    debugText.innerText = "Erro JSON";
                    debugText.style.color = "red";
                }
            };
        } else {
            debugText.innerText = "Sem Gecko";
        }
    </script>
</body>
</html>

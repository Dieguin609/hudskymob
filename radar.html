<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: transparent !important; overflow: hidden; width: 100%; height: 100%; }

        /* Container do Radar */
        .radar-frame {
            position: relative;
            width: 135px; height: 135px;
            border-radius: 50%;
            border: 2px solid white;
            /* FUNDO ROSA: Se ver isso, a imagem map.png FALHOU */
            background: #ff00ff; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            margin: 5px 0 0 15px;
            overflow: hidden;
            perspective: 600px;
            z-index: 1;
        }

        #map-container {
            position: absolute;
            width: 2500px; height: 2500px;
            transform-origin: center center;
            will-change: transform, left, top;
            /* Começa no centro (0,0) do mapa */
            left: -1250px; top: -1250px; 
        }

        .map-img {
            position: absolute; width: 100%; height: 100%;
            background-image: url('map.png'); 
            background-size: 100% 100%; 
            background-repeat: no-repeat;
        }

        #gps-svg-mini {
            position: absolute; width: 100%; height: 100%;
            z-index: 5; pointer-events: none;
        }

        .player-marker {
            position: absolute; top: 50%; left: 50%;
            width: 18px; height: 18px;
            background-image: url('seta.png');
            background-size: contain; background-repeat: no-repeat;
            background-position: center;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .glass-effect {
            position: absolute; inset: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
            z-index: 11; pointer-events: none;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
        }

        /* PAINEL DE DEBUG (Para descobrirmos a posição) */
        #debug-panel {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; text-align: center;
            font-family: monospace; font-size: 10px; font-weight: bold;
            color: #00ff00; text-shadow: 1px 1px 0 #000;
            z-index: 50; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="radar-frame">
        <div id="map-container">
            <div class="map-img"></div>
            <svg id="gps-svg-mini">
                <polyline id="gps-line" points="" fill="none" stroke="#bf00ff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />
            </svg>
        </div>
        <div class="player-marker"></div>
        <div class="glass-effect"></div>
        
        <div id="debug-panel">AGUARDANDO...</div>
    </div>

    <script>
        const IMG_SIZE = 2500;
        const MAP_SIZE = 6000; 
        const SCALE = IMG_SIZE / MAP_SIZE;
        const CENTER_OFFSET = 135 / 2;

        const mapContainer = document.getElementById('map-container');
        const gpsLine = document.getElementById('gps-line');
        const debugPanel = document.getElementById('debug-panel');
        
        function TentarConectar() {
            if (window.geckoju) {
                // Se conectou, limpa o texto inicial
                if(debugPanel.innerText == "AGUARDANDO...") debugPanel.innerText = "CONECTADO";

                window.geckoju.onData = function(data) {
                    try {
                        const obj = JSON.parse(data);

                        if (obj.pX !== undefined) {
                            // MOSTRA NA TELA: X e Y recebidos
                            // Se mostrar "0, 0", o erro é no servidor.
                            // Se mostrar números grandes (ex: 1500, -1200), está certo.
                            debugPanel.innerText = `X:${obj.pX.toFixed(0)} Y:${obj.pY.toFixed(0)}`;

                            let x = (IMG_SIZE / 2) + (obj.pX * SCALE);
                            let y = (IMG_SIZE / 2) - (obj.pY * SCALE);

                            mapContainer.style.left = `${-(x - CENTER_OFFSET)}px`;
                            mapContainer.style.top = `${-(y - CENTER_OFFSET)}px`;
                            
                            if (obj.pAngle !== undefined) {
                                mapContainer.style.transform = `rotateX(48deg) rotateZ(${obj.pAngle}deg)`;
                            }
                        }

                        // Atualiza GPS (Mesma lógica do seu PC)
                        if (obj.string_rota && obj.string_rota.length > 5) {
                            const pontos = obj.string_rota.split('|');
                            let polyPoints = "";
                            pontos.forEach(p => {
                                const c = p.split(',');
                                if(c.length >= 2) {
                                    let px = (IMG_SIZE / 2) + (parseFloat(c[0]) * SCALE);
                                    let py = (IMG_SIZE / 2) - (parseFloat(c[1]) * SCALE);
                                    polyPoints += `${px},${py} `;
                                }
                            });
                            gpsLine.setAttribute("points", polyPoints);
                        } else if (obj.gps_off) {
                            gpsLine.setAttribute("points", "");
                        }

                    } catch(e) {
                        debugPanel.innerText = "ERRO JSON";
                    }
                };
            } else {
                setTimeout(TentarConectar, 500);
            }
        }

        TentarConectar();
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: transparent !important; overflow: hidden; width: 100%; height: 100%; }

        .radar-frame {
            position: relative;
            width: 135px; height: 135px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.9);
            background: #1a1a1a; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            margin: 5px 0 0 15px;
            overflow: hidden;
            perspective: 800px;
            z-index: 1;
        }

        #rotator {
            position: absolute; top: 50%; left: 50%;
            width: 0; height: 0; transform-style: preserve-3d;
            /* Suavização via CSS também */
            transition: transform 0.1s linear; 
        }

        /* ZOOM FIX: Tamanho reduzido para 1500px (Afastar a câmera) */
        #map-layer {
            position: absolute;
            width: 1500px; height: 1500px; 
            top: 0; left: 0;
            will-change: transform;
        }

        .map-img {
            width: 100%; height: 100%;
            background-image: url('map.png'); 
            background-size: 100% 100%; 
            background-repeat: no-repeat;
        }

        .player-marker {
            position: absolute; top: 50%; left: 50%;
            width: 18px; height: 18px;
            background-image: url('seta.png');
            background-size: contain; background-repeat: no-repeat;
            background-position: center;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .glass-effect {
            position: absolute; inset: 0; border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
            z-index: 11; pointer-events: none;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <div class="radar-frame">
        <div id="rotator">
            <div id="map-layer">
                <div class="map-img"></div>
                <svg width="1500" height="1500" style="position:absolute; top:0; left:0;">
                     <polyline id="gps-line" points="" fill="none" stroke="#bf00ff" stroke-width="12" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
        <div class="player-marker"></div>
        <div class="glass-effect"></div>
    </div>

    <script>
        // --- CONFIGURAÇÃO DE ZOOM ---
        const IMG_SIZE = 1500; // MANTENHA 1500 PARA VER MAIS RUAS
        
        const MAP_SIZE = 6000; 
        const SCALE = IMG_SIZE / MAP_SIZE;
        const MAP_CENTER_OFFSET = IMG_SIZE / 2;

        // --- CALIBRAÇÃO FINA ---
        // Se a seta não bater com a rua, mude aqui:
        const OFFSET_X = 0; 
        const OFFSET_Y = 0; 

        const rotator = document.getElementById('rotator');
        const mapLayer = document.getElementById('map-layer');
        const gpsLine = document.getElementById('gps-line');

        // Suavização
        let currentAngle = 0;
        let targetAngle = 0;

        function shortestAngleDist(a0, a1) {
            var max = 360;
            var da = (a1 - a0) % max;
            return 2 * da % max - da;
        }

        function TentarConectar() {
            if (window.geckoju) {
                window.geckoju.onData = function(data) {
                    try {
                        const obj = JSON.parse(data);

                        if (obj.pX !== undefined) {
                            // Posição + Offset
                            let offsetX = (obj.pX * SCALE) + OFFSET_X;
                            let offsetY = -(obj.pY * SCALE) + OFFSET_Y;

                            let finalX = -MAP_CENTER_OFFSET - offsetX;
                            let finalY = -MAP_CENTER_OFFSET - offsetY;

                            mapLayer.style.transform = `translate3d(${finalX}px, ${finalY}px, 0)`;

                            // Rotação Suave
                            if (obj.pAngle !== undefined) {
                                targetAngle = obj.pAngle;
                                let dist = shortestAngleDist(currentAngle, targetAngle);
                                
                                // Se girar pouco, vai suave. Se girar muito (teleporte), vai direto.
                                if(Math.abs(dist) < 120) {
                                    currentAngle += dist * 0.25; 
                                } else {
                                    currentAngle = targetAngle;
                                }

                                rotator.style.transform = `rotateX(48deg) rotateZ(${currentAngle}deg)`;
                            }
                        }

                        // GPS
                        if (obj.string_rota && obj.string_rota.length > 5) {
                             const pontos = obj.string_rota.split('|');
                             let polyPoints = "";
                             pontos.forEach(p => {
                                 const c = p.split(',');
                                 if(c.length >= 2) {
                                     let px = MAP_CENTER_OFFSET + (parseFloat(c[0]) * SCALE);
                                     let py = MAP_CENTER_OFFSET - (parseFloat(c[1]) * SCALE);
                                     polyPoints += `${px},${py} `;
                                 }
                             });
                             gpsLine.setAttribute("points", polyPoints);
                        } else if (obj.gps_off) {
                            gpsLine.setAttribute("points", "");
                        }

                    } catch(e) {}
                };
            } else {
                setTimeout(TentarConectar, 500);
            }
        }
        
        // Mantém a animação rodando
        function animate() {
            requestAnimationFrame(animate);
        }
        
        TentarConectar();
        animate();
    </script>
</body>
</html>

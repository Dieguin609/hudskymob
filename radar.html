<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Mantém o fundo transparente e permite clicar através dele (exceto no radar) */
        html, body { 
            background: transparent !important; 
            overflow: hidden; 
            width: 100%; height: 100%; 
            pointer-events: none; /* O toque passa direto pro jogo */
        }

        .radar-frame {
            position: relative;
            /* SEU ESTILO ORIGINAL MANTIDO */
            width: 135px; height: 135px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.9);
            background: #1a1a1a; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            margin: 5px 0 0 15px;
            overflow: hidden;
            perspective: 800px;
            z-index: 1;

            /* ADIÇÃO: Permite clicar APENAS no radar */
            pointer-events: auto; 
            cursor: pointer;
        }

        /* Efeito visual ao clicar (opcional, bem sutil) */
        .radar-frame:active {
            transform: scale(0.98);
        }

        #map-rotator {
            position: absolute; top: 50%; left: 50%;
            width: 0; height: 0; transform-style: preserve-3d;
        }

        #map-layer {
            position: absolute;
            width: 2500px; height: 2500px; 
            top: -1250px; left: -1250px; 
            will-change: transform;
        }

        #map-img {
            width: 100%; height: 100%;
            background-image: url('map.png');
            background-size: 100% 100%;
            filter: brightness(1.1) contrast(1.1);
        }

        /* ADIÇÃO: Camada SVG para desenhar a rota */
        #gps-svg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
        }
        #gps-line {
            fill: none;
            stroke: #bf00ff; /* Cor da rota */
            stroke-width: 15;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 4px #bf00ff);
        }

        #arrow-rotator {
            position: absolute; top: 50%; left: 50%;
            width: 0; height: 0;
        }

        #player-arrow {
            position: absolute; top: 50%; left: 50%;
            width: 24px; height: 24px;
            background-image: url('seta.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transform: translate(-50%, -50%);
            z-index: 10;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.8));
        }

        .glass-overlay {
            position: absolute; inset: 0;
            border-radius: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 40%, rgba(0,0,0,0.3) 100%);
            z-index: 20; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="radar-frame" onclick="abrirMenu()" ontouchend="abrirMenu()">
        <div id="map-rotator">
            <div id="map-layer">
                <div id="map-img"></div>
                
                <svg id="gps-svg" width="2500" height="2500">
                    <polyline id="gps-line" points="" />
                </svg>

            </div>
        </div>

        <div id="arrow-rotator">
             <div id="player-arrow"></div>
        </div>

        <div class="glass-overlay"></div>
    </div>

    <script>
        const IMG_SIZE = 2500;
        const MAP_SIZE = 6000; 
        const SCALE = IMG_SIZE / MAP_SIZE;
        const OFFSET = IMG_SIZE / 2;
        const SMOOTH_SPEED = 0.3; // Mantido do seu arquivo original

        const mapRotator = document.getElementById('map-rotator');
        const mapLayer = document.getElementById('map-layer');
        const arrowRotator = document.getElementById('arrow-rotator');
        const gpsLine = document.getElementById('gps-line'); // Referência para a linha

        let targetPos = { x: 0, y: 0 };
        let currentPos = { x: 0, y: 0 };
        
        let targetCamAngle = 0, currentCamAngle = 0;
        let targetPlayerAngle = 0, currentPlayerAngle = 0;

        // Funções auxiliares (Mantidas)
        function lerp(start, end, t) { return start * (1 - t) + end * t; }
        
        function shortestAngleDist(a0, a1) {
            var max = 360; var da = (a1 - a0) % max; return 2 * da % max - da;
        }

        // ADIÇÃO: Função para enviar comando ao servidor ao clicar
        function abrirMenu() {
            if (window.geckoju) {
                window.geckoju.send("menu");
            }
        }

        // ADIÇÃO: Função para desenhar a rota no mapa
        function atualizarRota(rotaString) {
            // Se a rota for vazia ou "0", limpa o desenho
            if (!rotaString || rotaString === "0") {
                gpsLine.setAttribute("points", "");
                return;
            }

            const pontos = rotaString.split('|');
            let svgPoints = "";

            pontos.forEach(p => {
                const c = p.split(',');
                if (c.length === 2) {
                    // Converte coordenadas do GTA para pixels no radar
                    const px = OFFSET + (parseFloat(c[0]) * SCALE);
                    const py = OFFSET - (parseFloat(c[1]) * SCALE);
                    svgPoints += `${px},${py} `;
                }
            });
            gpsLine.setAttribute("points", svgPoints);
        }

        // Lógica de Conexão Geckoju
        function TentarConectar() {
            if (window.geckoju) {
                window.geckoju.onData = function(data) {
                    try {
                        const obj = JSON.parse(data);

                        // Atualiza Posição (Código Original)
                        if (obj.x !== undefined) {
                            targetPos.x = -(OFFSET + (obj.x * SCALE));
                            targetPos.y = -(OFFSET - (obj.y * SCALE));
                            targetCamAngle = obj.ca || 0;
                            targetPlayerAngle = obj.a || 0;
                        }

                        // ADIÇÃO: Recebe a rota (string_rota) e desenha
                        if (obj.string_rota) {
                            atualizarRota(obj.string_rota);
                        } else if (obj.gps_off) {
                            gpsLine.setAttribute("points", "");
                        }

                    } catch(e) {}
                };
            } else {
                setTimeout(TentarConectar, 500);
            }
        }

        TentarConectar();

        // Loop de Animação (Mantido Original)
        function animate() {
            currentPos.x = lerp(currentPos.x, targetPos.x, SMOOTH_SPEED);
            currentPos.y = lerp(currentPos.y, targetPos.y, SMOOTH_SPEED);
            
            mapLayer.style.transform = `translate3d(${currentPos.x}px, ${currentPos.y}px, 0)`;

            let distCam = shortestAngleDist(currentCamAngle, targetCamAngle);
            if(Math.abs(distCam) < 120) currentCamAngle += distCam * SMOOTH_SPEED;
            else currentCamAngle = targetCamAngle;
            
            mapRotator.style.transform = `rotateX(48deg) rotateZ(${currentCamAngle}deg)`;

            let distPlayer = shortestAngleDist(currentPlayerAngle, targetPlayerAngle);
            if(Math.abs(distPlayer) < 120) currentPlayerAngle += distPlayer * SMOOTH_SPEED;
            else currentPlayerAngle = targetPlayerAngle;

            let arrowRotation = currentPlayerAngle - currentCamAngle;
            arrowRotator.style.transform = `rotateZ(${-arrowRotation}deg)`; // Mantive seu negativo original

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>

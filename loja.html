<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPixel - Store UI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        
        body { 
            background: transparent; 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            color: #fff;
        }

        @keyframes fadeSlideIn {
            0% { opacity: 0; transform: translateX(-30px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeInRight {
            0% { opacity: 0; transform: translateX(30px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .fade-in { animation: fadeSlideIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        .left-panel {
            width: 300px;
            height: 100vh;
            background: linear-gradient(90deg, rgba(10, 10, 15, 0.95) 0%, rgba(10, 10, 15, 0.75) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 193, 7, 0.2);
        }

        .sub-header {
            font-size: 9px;
            color: #aaa;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: -2px;
        }

        .main-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .main-header h1 {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 193, 7, 0.3);
        }

        .decorative-lines {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .line { height: 2px; background: #FFC107; border-radius: 2px; }
        .line.long { width: 80px; box-shadow: 0 0 6px #FFC107; }
        .line.short { width: 20px; opacity: 0.5; }

        .items-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .items-scroll-area::-webkit-scrollbar { width: 3px; }
        .items-scroll-area::-webkit-scrollbar-thumb { background: rgba(255, 193, 7, 0.4); border-radius: 3px; }

        .item-row h3 {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ddd;
        }

        .selectors-container {
            display: flex;
            gap: 10px;
        }
        .selector-box { flex: 1; }
        .selector-label {
            font-size: 8px;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: block;
            font-weight: 800;
        }

        .pill-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(20, 20, 30, 0.8);
            border: 1px solid rgba(255, 193, 7, 0.5);
            border-radius: 20px;
            padding: 4px 10px;
            transition: 0.3s;
        }
        .pill-selector:hover {
            box-shadow: 0 0 12px rgba(255, 193, 7, 0.2);
            background: rgba(255, 193, 7, 0.05);
        }
        .pill-selector button {
            background: none;
            border: none;
            color: #FFC107;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            padding: 0 4px;
        }
        .pill-selector button:hover { color: #fff; transform: scale(1.2); }
        .pill-selector span {
            font-size: 12px;
            font-weight: 800;
            color: #fff;
            min-width: 15px;
            text-align: center;
        }

        .bottom-controls {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .toggle-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .toggle-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .toggle-btn.active {
            background: #FFC107;
            color: #000;
            box-shadow: 0 0 8px rgba(255, 193, 7, 0.5);
        }
        .slider-container { margin-bottom: 10px; }
        .slider-container input[type="range"] {
            width: 100%;
            appearance: none;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #FFC107;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(255, 193, 7, 0.8);
        }

        .right-area {
            flex: 1;
            position: relative;
        }

        .category-sidebar {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeInRight 0.8s ease forwards;
        }
        .category-sidebar::before {
            content: '';
            position: absolute;
            top: 10%;
            bottom: 10%;
            right: 20px;
            width: 2px;
            background-image: linear-gradient(to bottom, transparent 50%, rgba(255,193,7,0.3) 50%);
            background-size: 2px 12px;
            z-index: -1;
            border-radius: 50%;
        }

        .cat-icon img {
            width: 36px;    /* Diminua ou aumente este valor (ex: 14px, 16px, 18px) */
            height: 36px;   /* Mantenha o mesmo valor da largura para o ícone continuar quadrado */
            object-fit: contain;
            pointer-events: none;
        }
        .cat-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(20, 20, 25, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #888;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cat-icon:hover { color: #fff; border-color: #FFC107; transform: scale(1.1) translateX(-3px); }
        .cat-icon.active {
            background: #FFC107;
            border: 2px solid #FFC107;
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.4);
            transform: scale(1.15) translateX(-6px);
        }
        .cat-icon.active img {
            filter: brightness(0);
        }

        .action-buttons {
            position: absolute;
            bottom: 20px;
            right: 80px;
            display: flex;
            gap: 10px;
        }
        .btn-action {
            background: rgba(20, 20, 25, 0.8);
            border: 1px solid rgba(255, 193, 7, 0.5);
            color: #FFC107;
            padding: 8px 18px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-action:hover { background: #FFC107; color: #000; box-shadow: 0 0 12px rgba(255, 193, 7, 0.4); }
        .btn-cancel { border-color: #ff4444; color: #ff4444; }
        .btn-cancel:hover { background: #ff4444; color: #fff; box-shadow: 0 0 12px rgba(255, 68, 68, 0.4); }
    </style>
</head>

        function definirIdentidadePlayer(genero, pele) {
            if (genero) generoAtual = genero.toLowerCase();
            if (pele) peleAtual = pele.toLowerCase();
            selecoes = {}; 
            renderizarItens();
        }

        function mudarCategoria(cat, elemento) {
            if (catAtual === cat) return; 
            catAtual = cat;
            document.querySelectorAll('.cat-icon').forEach(el => el.classList.remove('active'));
            elemento.classList.add('active');
            renderizarItens();
        }

        function renderizarItens() {
            const container = document.getElementById('items-container');
            // Proteção caso a categoria não exista no bancoDeRoupas
            if (!bancoDeRoupas[generoAtual] || !bancoDeRoupas[generoAtual][catAtual]) return;

            const dados = bancoDeRoupas[generoAtual][catAtual];
            document.getElementById('menu-title').innerText = dados.titulo;
            container.style.opacity = '0';
            
            setTimeout(() => {
                container.innerHTML = '';
                dados.opcoes.forEach((item, index) => {
                    let keyId = `${generoAtual}_${catAtual}_${index}`;
                    if (!selecoes[keyId]) selecoes[keyId] = { mod: 0, tex: 0 };
                    
                    let maxTex = item.texturas[peleAtual] ? item.texturas[peleAtual].length : 1;
                    if (selecoes[keyId].tex >= maxTex) selecoes[keyId].tex = 0;

                    let selMod = selecoes[keyId].mod;
                    let selTex = selecoes[keyId].tex;

                    container.innerHTML += `
                        <div class="item-row fade-in" style="animation-delay: ${index * 0.1}s">
                            <h3>${item.nome}</h3>
                            <div class="selectors-container">
                                <div class="selector-box">
                                    <span class="selector-label">MODELO</span>
                                    <div class="pill-selector">
                                        <button onclick="alterarValor('${keyId}', 'mod', -1, ${index})">❮</button>
                                        <span id="val_mod_${keyId}">${selMod}</span>
                                        <button onclick="alterarValor('${keyId}', 'mod', 1, ${index})">❯</button>
                                    </div>
                                </div>
                                <div class="selector-box">
                                    <span class="selector-label">TEXTURA</span>
                                    <div class="pill-selector">
                                        <button onclick="alterarValor('${keyId}', 'tex', -1, ${index})">❮</button>
                                        <span id="val_tex_${keyId}">${selTex}</span>
                                        <button onclick="alterarValor('${keyId}', 'tex', 1, ${index})">❯</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.style.opacity = '1';
                if (dados.opcoes.length > 0) enviarPreview(catAtual, 0); 
            }, 250);
        }

        function alterarValor(keyId, tipo, direcao, idxItem) {
            let itemData = bancoDeRoupas[generoAtual][catAtual].opcoes[idxItem];
            let arrayAlvo = tipo === 'mod' ? itemData.modelos : itemData.texturas[peleAtual];
            if (!arrayAlvo || arrayAlvo.length === 0) return; 

            selecoes[keyId][tipo] += direcao;
            if (selecoes[keyId][tipo] < 0) selecoes[keyId][tipo] = arrayAlvo.length - 1;
            if (selecoes[keyId][tipo] >= arrayAlvo.length) selecoes[keyId][tipo] = 0;
            
            document.getElementById(`val_${tipo}_${keyId}`).innerText = selecoes[keyId][tipo];
            enviarPreview(catAtual, idxItem);
        }

        // 2. FUNÇÃO CORRIGIDA PARA BATER COM O PAWN
        function enviarPreview(cat, idxItem) {
            let keyId = `${generoAtual}_${cat}_${idxItem}`;
            
            // Verifica se a seleção e o banco existem
            if(!selecoes[keyId] || !bancoDeRoupas[generoAtual] || !bancoDeRoupas[generoAtual][cat]) return;

            let selModIndex = selecoes[keyId].mod;
            let selTexIndex = selecoes[keyId].tex;

            let dadosCat = bancoDeRoupas[generoAtual][cat];
            let item = dadosCat.opcoes[idxItem];

            // Pega o slot da categoria e os nomes exatos do DFF e TXD
            let slot = dadosCat.slotId;
            let dffNome = item.modelos[selModIndex];
            let txdNome = item.texturas[peleAtual][selTexIndex];

            if (window.geckoju) {
                // Envia no formato exato que o servidor espera: comprar_roupa|slot|txd|dff
                window.geckoju.send(`comprar_roupa|${slot}|${txdNome}|${dffNome}`);
            }
        }

        function finalizarLoja() {
            if (window.geckoju) window.geckoju.send("fechar_loja");
        }

        function fecharLoja() {
            if (window.geckoju) {
                window.geckoju.send("resetar_roupas");
                window.geckoju.send("fechar_loja");
            }
        }

        let carregouDados = false;
        const originalDefinir = window.definirIdentidadePlayer;
        window.definirIdentidadePlayer = function(g, p) {
            carregouDados = true;
            originalDefinir(g, p);
        };

        setTimeout(() => {
            if (!carregouDados) {
                definirIdentidadePlayer('masculino', 'branca');
            }
        }, 400);
    </script>
</body>
</html>
